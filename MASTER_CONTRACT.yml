masterization:
  version: v0.3
  module_id: python_reading_trainer
  release: V400.7
  role: learning_card_command_code_project_analyzer
  future_role: clipboard_aware_command_code_log_interpreter
  ontology: D:\projects\project_master_architecture\ontology\readme_contract_ontology_v0_1.yml
  source_root: D:\projects\python-reading-trainer
  master_ref: D:\projects\project_master_architecture\modules\python_reading_trainer\module_ref.yml
  system_architecture: D:\projects\project_master_architecture\modules\python_reading_trainer\system_architecture_v0_1.md
  read_priority:
  - README.md
  - MASTER_CONTRACT.yml
  - index.html
  - src/pwa/index.html
  - src/pwa/app.js
  - src/pwa/developer_auth_v1_config.js
  - src/pwa/developer_mode_v1.js
  - src/pwa/developer_workbench_v400_6_2.js
  - src/pwa/code_explainer.js
  - src/pwa/code_explainer_rules.js
  - src/pwa/command_explainer.js
  - src/pwa/project_analyzer.js
  - docs/quality/
  stable_entrypoints:
    frontend:
    - index.html
    - src/pwa/index.html
    - src/pwa/app.js
    - src/pwa/developer_auth_v1_config.js
    - src/pwa/developer_auth_v1.js
    - src/pwa/developer_remote_entry_v400_6_1.js
    - src/pwa/developer_workbench_v400_6_2.js
    - src/pwa/code_explainer.js
    - src/pwa/code_explainer_rules.js
    - src/pwa/command_explainer.js
    - src/pwa/project_analyzer.js
    backend: []
    runtime_type: static_pwa_frontend_with_external_owner_auth
  external_services:
    developer_auth:
      status: production_runtime_dependency_for_remote_developer_only
      base_url: https://veriautonomy.com/api/prt-developer
      purpose: github_owner_authentication
      boundary_rule: public learning remains usable without Developer authentication; remote Developer requires the external auth service.
  access_contract:
    public_learning: enabled
    remote_developer: github_owner_auth_required
    local_developer: localhost_authority
    remote_admin: disabled
    local_admin: localhost_only
    admin_loader: src/pwa/admin_local_loader_v400_7.js
  implemented_runtime_features:
  - learning cards
  - 8-axis diagnostic and remediation loop
  - code explainer
  - command explainer
  - project analyzer
  - memo/progress/outline UI
  - copy/report workflow
  - PWA surface
  - branded startup splash
  - bilingual KO/EN runtime bundles
  - authenticated remote Developer content workbench
  - localhost-only Admin Mode
  content_authoring_pipeline:
    status: confirmed_static_content_production_layer
    authoring_tools:
    - GPT Web manual drafting
    - DeepL manual translation
    - Human copy editing
    - Manual UI/card placement
    - Manual example curation
    runtime_dependency:
      gpt_web: false
      deepl: false
    boundary_rule: GPT Web and DeepL are authoring aids, not live runtime dependencies.
  quality_audit_pipeline:
    status: confirmed_project_governance_layer
    role: content_code_ui_release_gate
    symbols:
    - audit_vXXX
    - patch_vXXX
    - docs/quality/*
    - quality-vXXX tags
    - tools/validate_bilingual_lessons_v400_7.py
    - tools/validate_diagnostic_v400_7.py
    boundary_rule: Quality audit is a governance pipeline, not a live runtime AI service.
  release_hardening:
    persistent_body_observer_for_developer_entry: prohibited
    persistent_polling_for_developer_entry: prohibited
    public_admin_static_assets: prohibited
    service_worker_forced_reload: prohibited
    bilingual_lesson_validation: required
    diagnostic_parity_validation: required
  planned_capabilities:
  - clipboard_aware_command_interpreter
  - clipboard_aware_code_interpreter
  - terminal_output_interpreter
  - error_log_interpreter
  - vibe_coding_safety_overlay
  - local_first_static_analysis
  safety_rules:
  - Never execute clipboard content.
  - Clipboard monitoring must be opt-in.
  - Do not send clipboard content externally by default.
  - Mask secrets, tokens, API keys, private paths, and credentials.
  - Mark clipboard interpretation as planned capability until implemented.
  artifact_policy:
    commit_allowed:
    - README.md
    - MASTER_CONTRACT.yml
    - index.html
    - src/
    - docs/
    - tools/
    archive_preferred:
    - reports/
    - out/
    - screenshots/
    - release_assets/
    ignore_or_review:
    - node_modules/
    - .venv/
    - __pycache__/
    - dist/
    - cache/
    - temp/
    - logs/
  never_auto_delete:
  - backup files
  - quality reports
  - release tags
  - source examples
  - manual content assets
