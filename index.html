<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="1; url=./src/pwa/?release=20260821_v400_1">
  <title>Python Reading Trainer</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f8fafc; color:#0f172a; }
    main { width:min(92vw,520px); padding:24px; border:1px solid #e2e8f0; border-radius:18px; background:#fff; box-shadow:0 10px 30px rgba(15,23,42,.08); }
    h1 { margin:0 0 8px; font-size:24px; line-height:1.2; }
    p { margin:8px 0; color:#475569; line-height:1.5; }
    a { display:inline-block; margin-top:12px; padding:10px 14px; border-radius:999px; background:#2563eb; color:#fff; text-decoration:none; font-weight:800; }
  </style>
</head>
<body>
  <main>
    <h1>Python Reading Trainer</h1>
    <p>학습 앱으로 이동하고 있습니다.</p>
    <p>자동으로 이동하지 않으면 아래 버튼을 누르세요.</p>
    <a id="openApp" href="./src/pwa/?release=20260821_v400_1">학습 앱 열기</a>
    <p style="font-size:12px;">version: V400.1 · 20260821</p>
  </main>
  <script>
    (function () {
      var target = new URL("./src/pwa/", window.location.href);
      var incoming = new URLSearchParams(window.location.search || "");
      incoming.forEach(function (value, key) {
        target.searchParams.set(key, value);
      });
      if (!target.searchParams.has("release")) {
        target.searchParams.set("release", "20260821_v400_1");
      }
      if (window.location.hash) {
        target.hash = window.location.hash;
      }
      var link = document.getElementById("openApp");
      if (link) link.href = target.href;
      window.location.replace(target.href);
    })();
  </script>
</body>
</html>
