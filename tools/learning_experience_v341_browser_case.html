<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRT V341 A2 Browser Case</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:12px;background:#f5f6f8;color:#172033}.summary{padding:10px;border-radius:10px;background:#fff;border:1px solid #d8dee8;margin-bottom:10px}.pass{color:#137333}.fail{color:#b3261e}iframe{display:block;border:1px solid #aab4c3;background:#fff}pre{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:12px;border-radius:10px;max-height:560px;overflow:auto}
  </style>
</head>
<body>
  <div id="summary" class="summary">RUNNING</div>
  <iframe id="appFrame" height="1200"></iframe>
  <pre id="report">RUNNING</pre>
<script>
(function(){
  "use strict";
  const params = new URLSearchParams(location.search);
  const caseName = params.get("case") === "narrow" ? "narrow" : "desktop";
  const width = caseName === "narrow" ? 390 : 1200;
  const frame = document.getElementById("appFrame");
  frame.width = String(width);
  const lines = ["=== PRT V341 A2 REAL BROWSER CASE ===", "CASE=" + caseName.toUpperCase(), "WIDTH=" + width];
  const results = [];
  const PROGRESS_KEY = "python-reading-trainer-progress-v1";
  const V341_KEY = "python-reading-trainer-learning-experience-v341";
  const NOTE_SENTINEL = "python-reading-trainer-v341-note-sentinel";

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  async function waitFor(fn, timeout=18000) {
    const start = Date.now();
    while (Date.now() - start < timeout) {
      try { const value = fn(); if (value) return value; } catch (_) {}
      await sleep(80);
    }
    return null;
  }
  function check(label, ok, detail) {
    const row = {label, ok:Boolean(ok), detail:String(detail == null ? "" : detail)};
    results.push(row);
    lines.push(label + "=" + (row.ok ? "PASS" : "FAIL") + " DETAIL=" + row.detail);
    return row.ok;
  }
  function appUrl(extra) {
    return "/src/pwa/index.html?v341a2case=" + caseName + "&" + (extra || "phase") + "=" + Date.now();
  }
  async function waitReady() {
    return waitFor(() => {
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      if (!doc || !win || doc.readyState !== "complete") return null;
      if (doc.documentElement.dataset.learningLoopV340 !== "v340_a1") return null;
      if (doc.documentElement.dataset.learningExperienceV341 !== "v341_a2") return null;
      if (!win.LearningEngineV341 || win.LearningEngineV341.VERSION !== "v341_a2") return null;
      if (!doc.getElementById("practiceDashboardV341")) return null;
      if (!doc.querySelectorAll(".choice-btn").length) return null;
      return {doc, win};
    }, 30000);
  }
  async function initialCleanLoad() {
    frame.src = appUrl("initial");
    const first = await waitFor(() => frame.contentDocument && frame.contentWindow && frame.contentDocument.readyState === "complete" ? {doc:frame.contentDocument,win:frame.contentWindow} : null, 20000);
    if (!first) return null;
    try {
      first.win.localStorage.clear();
      first.win.sessionStorage.clear();
      if (first.win.navigator.serviceWorker && first.win.navigator.serviceWorker.getRegistrations) {
        const regs = await first.win.navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg => reg.unregister()));
      }
    } catch (_) {}
    frame.src = appUrl("clean");
    return waitReady();
  }
  async function reloadReady(tag) {
    frame.src = appUrl(tag);
    return waitReady();
  }
  function clickTab(doc, view) {
    const button = doc.querySelector('.tab-btn[data-view="' + view + '"]');
    if (button) button.click();
    return button;
  }
  function practiceText(doc) {
    const view = doc.getElementById("practiceView");
    return view ? view.textContent.replace(/\s+/g, " ").trim() : "";
  }
  function syntheticProgress(win, count) {
    const ids = JSON.parse(win.eval("JSON.stringify(cards.slice(0," + count + ").map(function(c){return c.id;}))"));
    const progress = {seen:{}, correct:{}, confused:{}, lastSeenAt:{}};
    ids.forEach((id, index) => {
      progress.seen[id] = Date.now();
      progress.correct[id] = index % 7 === 0 ? 0 : 1;
      if (index % 7 === 0) progress.confused[id] = 1;
      progress.lastSeenAt[id] = Date.now();
    });
    win.localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    const events = ids.map((id, index) => ({kind:"lesson_attempt",cardId:id,at:Date.now() - (index % 3) * 86400000}));
    win.localStorage.setItem(V341_KEY, JSON.stringify({events, completedCheckpoints:[], lastToastKey:""}));
    return ids;
  }
  function expectedCheckpoint(win, number) {
    return win.eval(`LearningEngineV341.missionForCheckpoint(${Number(number)}, "ko", cards, function(card){return ContentQualitySemantics.pickPrimaryConcept(card || {}, card && card.concepts || [], conceptInfo || {});})`);
  }
  function expectedModule(win, moduleId, count) {
    return win.eval(`LearningEngineV341.missionForPracticeModule(${JSON.stringify(moduleId)}, ${Number(count)}, "ko", cards, function(card){return ContentQualitySemantics.pickPrimaryConcept(card || {}, card && card.concepts || [], conceptInfo || {});})`);
  }

  async function main() {
    const ready = await initialCleanLoad();
    check("PWA_V341_A2_READY", !!ready, ready ? "dataset=v341_a2" : "timeout");
    if (!ready) return finish();
    let {doc, win} = ready;

    check("ONE_PRACTICE_TAB", doc.querySelectorAll('.tab-btn[data-view="practice"]').length === 1, "count=" + doc.querySelectorAll('.tab-btn[data-view="practice"]').length);
    check("ONE_PRACTICE_VIEW", doc.querySelectorAll("#practiceView").length === 1, "count=" + doc.querySelectorAll("#practiceView").length);
    check("ONE_PRACTICE_DASHBOARD", doc.querySelectorAll("#practiceDashboardV341").length === 1, "count=" + doc.querySelectorAll("#practiceDashboardV341").length);
    check("LEARNING_SUMMARY_PRESENT", doc.querySelectorAll("#learningSummaryV341").length === 1, "count=" + doc.querySelectorAll("#learningSummaryV341").length);

    const practiceTab = clickTab(doc, "practice");
    await sleep(180);
    check("PRACTICE_TAB_OPENS", !!practiceTab && doc.getElementById("practiceView").classList.contains("active-view"), "active=" + doc.getElementById("practiceView").classList.contains("active-view"));
    let text = practiceText(doc);
    check("INITIAL_CHECKPOINT_LOCKED", /첫 실전 체크포인트까지\s*30문제/.test(text), text.slice(0, 220));
    check("PRACTICE_HEADING_IS_PYTHON_CENTERED", /Python 실전 주제/.test(text), text.slice(0, 320));
    const moduleText = doc.querySelector(".practice-v341-modules") ? doc.querySelector(".practice-v341-modules").textContent : "";
    check("FIXED_DEV_WORKFLOW_MODULES_ABSENT", !/(안전한 변경 절차|회귀 테스트|멱등성과 재실행 안전성|CI 품질 게이트|기준선 비교와 롤백)/.test(moduleText), moduleText.slice(0, 300));
    check("MASTERY_MAP_VISIBLE", doc.querySelectorAll(".mastery-v341-row").length > 0, "rows=" + doc.querySelectorAll(".mastery-v341-row").length);
    check("WEEKLY_TARGET_VISIBLE", /이번 주\s*0\/50문제\s*·\s*0\/5일/.test(text), text.match(/이번 주[^.]{0,60}/)?.[0] || "not found");
    check("NO_BADGE_XP_CURRENCY_UI", !/(배지|\bXP\b|\bbadge\b|\bcoin\b|loot)/i.test(text), "no gamified currency/reward labels");

    const devRef = await waitFor(() => doc.getElementById("developmentWorkflowReferenceV341"), 4000);
    check("DEVELOPMENT_WORKFLOW_REFERENCE_PRESENT", !!devRef, devRef ? "present" : "missing");
    check("DEVELOPMENT_WORKFLOW_REFERENCE_16_CARDS", !!devRef && devRef.querySelectorAll("details.devflow-v341-item").length === 16, devRef ? "count=" + devRef.querySelectorAll("details.devflow-v341-item").length : "missing");
    const devRefText = devRef ? devRef.textContent.replace(/\s+/g," ") : "";
    check("DEVELOPMENT_WORKFLOW_PHASES_PRESENT", /개발 전/.test(devRefText) && /개발 중/.test(devRefText) && /검증·리뷰/.test(devRefText) && /배포·운영/.test(devRefText), devRefText.slice(0, 260));
    check("REGRESSION_IDEMPOTENCE_ARE_REFERENCES", /회귀 테스트/.test(devRefText) && /멱등성과 재실행 안전성/.test(devRefText), "reference topics present");

    clickTab(doc, "learning");
    await sleep(100);
    doc.getElementById("againBtn").click();
    const eventRecorded = await waitFor(() => {
      try {
        const state = JSON.parse(win.localStorage.getItem(V341_KEY) || "{}");
        return Array.isArray(state.events) && state.events.some(row => row.kind === "lesson_attempt") ? state : null;
      } catch (_) { return null; }
    }, 4000);
    check("REAL_ATTEMPT_RECORDED", !!eventRecorded, eventRecorded ? "events=" + eventRecorded.events.length : "no V341 lesson event");
    const advancedSummary = await waitFor(() => {
      const node = doc.getElementById("learningSummaryV341");
      const value = node ? node.textContent.replace(/\s+/g," ") : "";
      return /순차 학습\s*1\s*\/\s*1785/.test(value) ? value : null;
    }, 4000);
    check("SUMMARY_ADVANCES_FROM_REAL_ATTEMPT", !!advancedSummary, advancedSummary || "summary not advanced");

    syntheticProgress(win, 30);
    const ready30 = await reloadReady("thirty");
    check("SYNTHETIC_30_READY", !!ready30, ready30 ? "ready" : "reload timeout");
    if (!ready30) return finish();
    doc = ready30.doc; win = ready30.win;
    clickTab(doc, "practice");
    await sleep(180);
    text = practiceText(doc);
    check("CHECKPOINT_1_UNLOCKED", /체크포인트 1 미션 풀기/.test(text), "button=" + /체크포인트 1 미션 풀기/.test(text));

    const checkpointButton = await waitFor(() => frame.contentDocument && frame.contentDocument.querySelector('.practice-v341-primary[data-mission-checkpoint-v341="1"]'), 4000);
    check("CHECKPOINT_BUTTON_ACTION_BOUND", !!checkpointButton && checkpointButton.dataset.missionCheckpointV341 === "1", checkpointButton ? "mission=1" : "missing");
    const expectedCp = expectedCheckpoint(win, 1);
    if (checkpointButton) checkpointButton.click();
    let mission = await waitFor(() => {
      const modal = frame.contentDocument && frame.contentDocument.getElementById("missionModalV341");
      return modal && !modal.classList.contains("hidden") ? modal : null;
    }, 3000);
    doc = frame.contentDocument; win = frame.contentWindow;
    const cpQuestion = mission ? mission.querySelector(".mission-v341-question").textContent.trim() : "";
    const cpCode = mission ? mission.querySelector(".mission-v341-code").textContent.trim() : "";
    check("CHECKPOINT_MISSION_OPENS", !!mission, mission ? "open" : "missing");
    check("CHECKPOINT_HAS_PYTHON_CODE", !!cpCode, cpCode.replace(/\n/g," | ").slice(0,180));
    check("CHECKPOINT_MATCHES_ENGINE_LEARNED_TOPIC", !!mission && cpQuestion === expectedCp.question && cpCode === String(expectedCp.code || "").trim(), expectedCp.id + ':' + expectedCp.kind);
    check("CHECKPOINT_NOT_DEV_WORKFLOW_QUIZ", !/(회귀|멱등|CI|PR|commit|diff|배포|롤백|rollback)/i.test(cpQuestion), cpQuestion);
    if (mission) {
      const answer = mission.querySelectorAll(".mission-v341-choice")[expectedCp.answerIndex];
      if (answer) answer.click();
      await sleep(140);
    }
    const completedState = JSON.parse(win.localStorage.getItem(V341_KEY) || "{}");
    check("CHECKPOINT_COMPLETION_RECORDED", Array.isArray(completedState.completedCheckpoints) && completedState.completedCheckpoints.includes(1), JSON.stringify(completedState.completedCheckpoints || []));
    const toast = doc.getElementById("toastV341");
    check("QUIET_COMPLETION_TOAST", !!toast && /체크포인트 1 통과/.test(toast.textContent), toast ? toast.textContent : "missing");
    if (mission) mission.querySelector(".mission-v341-close").click();

    const unlockedModuleButton = await waitFor(() => {
      const currentDoc = frame.contentDocument;
      return currentDoc && currentDoc.querySelector('.practice-v341-module:not(.locked) button[data-practice-module-v341]:not(:disabled)');
    }, 4000);
    const moduleId = unlockedModuleButton ? unlockedModuleButton.dataset.practiceModuleV341 : "";
    check("LEARNED_TOPIC_MODULE_AVAILABLE", !!unlockedModuleButton && !!moduleId, moduleId || "missing");
    const expectedModuleMission = moduleId ? expectedModule(win, moduleId, 30) : null;
    const beforeModuleCompleted = JSON.stringify((JSON.parse(win.localStorage.getItem(V341_KEY) || "{}").completedCheckpoints || []).slice());
    if (unlockedModuleButton) unlockedModuleButton.click();
    const moduleMission = await waitFor(() => {
      const modal = frame.contentDocument && frame.contentDocument.getElementById("missionModalV341");
      return modal && !modal.classList.contains("hidden") && modal.dataset.practiceModule === moduleId ? modal : null;
    }, 3000);
    doc = frame.contentDocument; win = frame.contentWindow;
    const moduleCode = moduleMission ? moduleMission.querySelector(".mission-v341-code").textContent.trim() : "";
    check("TOPIC_MODULE_MISSION_OPENS", !!moduleMission, moduleId || "missing");
    check("TOPIC_MODULE_HAS_PYTHON_CODE", !!moduleCode, moduleCode.replace(/\n/g," | ").slice(0,180));
    if (moduleMission && expectedModuleMission) {
      const answer = moduleMission.querySelectorAll(".mission-v341-choice")[expectedModuleMission.answerIndex];
      if (answer) answer.click();
      await sleep(140);
    }
    const afterModuleState = JSON.parse(win.localStorage.getItem(V341_KEY) || "{}");
    check("MODULE_PRACTICE_DOES_NOT_COMPLETE_CHECKPOINT", JSON.stringify(afterModuleState.completedCheckpoints || []) === beforeModuleCompleted, JSON.stringify(afterModuleState.completedCheckpoints || []));
    if (moduleMission) moduleMission.querySelector(".mission-v341-close").click();

    try {
      win.renderPracticeV341();
      win.renderPracticeV341();
      win.renderLearningSummaryV341();
      win.renderLearningSummaryV341();
    } catch (_) {}
    await sleep(100);
    doc = frame.contentDocument; win = frame.contentWindow;
    check("NO_DUPLICATE_PRACTICE_DASHBOARD", doc.querySelectorAll("#practiceDashboardV341").length === 1, "count=" + doc.querySelectorAll("#practiceDashboardV341").length);
    check("NO_DUPLICATE_MISSION_MODAL", doc.querySelectorAll("#missionModalV341").length === 1, "count=" + doc.querySelectorAll("#missionModalV341").length);
    check("NO_DUPLICATE_DEVELOPMENT_REFERENCE", doc.querySelectorAll("#developmentWorkflowReferenceV341").length === 1, "count=" + doc.querySelectorAll("#developmentWorkflowReferenceV341").length);

    win.localStorage.setItem(NOTE_SENTINEL, "keep-me");
    win.confirm = function() { return true; };
    clickTab(doc, "learning");
    await sleep(80);
    const resetBtn = doc.getElementById("resetBtn");
    check("RESET_BUTTON_PRESENT", !!resetBtn, resetBtn ? "present" : "missing");
    if (resetBtn) resetBtn.click();
    const resetStateCleared = await waitFor(() => frame.contentWindow && frame.contentWindow.localStorage.getItem(V341_KEY) === null ? true : null, 4000);
    doc = frame.contentDocument; win = frame.contentWindow;
    check("RESET_CLEARS_V341_STATE", !!resetStateCleared, "value=" + String(win.localStorage.getItem(V341_KEY)));
    check("RESET_PRESERVES_NOTE_SENTINEL", win.localStorage.getItem(NOTE_SENTINEL) === "keep-me", "value=" + String(win.localStorage.getItem(NOTE_SENTINEL)));
    const afterResetSummary = await waitFor(() => {
      const node = frame.contentDocument && frame.contentDocument.getElementById("learningSummaryV341");
      const value = node ? node.textContent.replace(/\s+/g," ") : "";
      return /순차 학습\s*0\s*\/\s*1785/.test(value) ? value : null;
    }, 4000);
    check("RESET_RETURNS_V341_SEQUENCE_ZERO", !!afterResetSummary, afterResetSummary || "summary not reset");

    doc = frame.contentDocument;
    clickTab(doc, "practice");
    const visiblePractice = await waitFor(() => {
      const currentDoc = frame.contentDocument;
      const view = currentDoc && currentDoc.getElementById("practiceView");
      if (!view || !view.classList.contains("active-view")) return null;
      const rect = view.getBoundingClientRect();
      return rect.width > 0 ? rect : null;
    }, 4000);
    doc = frame.contentDocument;
    const root = doc.documentElement;
    const viewRect = visiblePractice || {left:0,right:0,width:0};
    check("PRACTICE_WITHIN_VIEWPORT", viewRect.width > 0 && viewRect.left >= -1 && viewRect.right <= root.clientWidth + 1, "left=" + Math.round(viewRect.left) + " right=" + Math.round(viewRect.right) + " viewport=" + root.clientWidth);
    check("NO_OUTER_HORIZONTAL_OVERFLOW", root.scrollWidth <= root.clientWidth + 2, "scrollWidth=" + root.scrollWidth + " clientWidth=" + root.clientWidth);
    finish();
  }

  function finish() {
    const pass = results.length > 0 && results.every(row => row.ok);
    lines.push("RESULT=" + (pass ? "PASS_LEARNING_EXPERIENCE_V341_REAL_BROWSER_CASE" : "FAIL_LEARNING_EXPERIENCE_V341_REAL_BROWSER_CASE"));
    document.getElementById("report").textContent = lines.join("\n");
    const summary = document.getElementById("summary");
    summary.textContent = pass ? caseName.toUpperCase() + " PASS" : caseName.toUpperCase() + " FAIL";
    summary.className = "summary " + (pass ? "pass" : "fail");
    document.documentElement.dataset.smokeDone = pass ? "pass" : "fail";
  }

  main().catch(error => {
    lines.push("HARNESS_ERROR=" + (error && error.stack ? error.stack : String(error)));
    lines.push("RESULT=FAIL_LEARNING_EXPERIENCE_V341_REAL_BROWSER_CASE");
    document.getElementById("report").textContent = lines.join("\n");
    document.documentElement.dataset.smokeDone = "fail";
  });
})();
</script>
</body>
</html>
