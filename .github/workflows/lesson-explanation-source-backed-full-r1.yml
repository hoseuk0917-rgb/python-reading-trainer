name: Lesson explanation source-backed full batch R1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/run_lesson_explanation_source_backed_r1.py'
      - 'tools/run_lesson_explanation_api_pilot_r1.py'
      - 'tools/plan_source_backed_explanation_r1.py'
      - 'tools/audit_source_bundle_mapping_r1.py'
      - 'tools/audit_explanation_readiness_r1.py'
      - 'docs/LESSON_EXPLANATION_CONTRACT_V1.md'
      - '.github/workflows/lesson-explanation-source-backed-full-r1.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the complete current 86-card source-ready batch'
        required: false
        default: false
        type: boolean
      resume_run_id:
        description: 'Optional failed full-batch run ID whose validated successful results should be resumed'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: lesson-explanation-source-backed-full-r1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile source-backed tooling
        run: |
          python -m py_compile tools/run_lesson_explanation_source_backed_r1.py
          python -m py_compile tools/plan_source_backed_explanation_r1.py
          python -m py_compile tools/audit_source_bundle_mapping_r1.py
          python -m py_compile tools/audit_explanation_readiness_r1.py

      - name: Source-backed runner self-test
        run: python tools/run_lesson_explanation_source_backed_r1.py --self-test

      - name: Verify frozen 86-card full-batch selection
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_lesson_explanation_source_backed_r1.py --plan --limit 86 \
            | tee "$RUNNER_TEMP/source-backed-full-plan.txt"

          grep -F 'SOURCE_READY_INVENTORY=86' "$RUNNER_TEMP/source-backed-full-plan.txt"
          grep -F 'SOURCE_BACKED_LIMIT=86' "$RUNNER_TEMP/source-backed-full-plan.txt"
          grep -F 'SOURCE_BACKED_EXPLICIT_SELECTION=NO' "$RUNNER_TEMP/source-backed-full-plan.txt"
          grep -F 'SOURCE_BACKED_SELECTION_SHA256=dc7a371eb8bbc91dd336461b1169e4ab4dcd55c5536f72e15f0e4d9e835c25d3' \
            "$RUNNER_TEMP/source-backed-full-plan.txt"
          grep -F 'LESSON_EXPLANATION_SOURCE_BACKED_R1_PLAN=PASS' \
            "$RUNNER_TEMP/source-backed-full-plan.txt"

      - name: Verify pre-batch source inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/plan_source_backed_explanation_r1.py --limit 0 \
            | tee "$RUNNER_TEMP/source-backed-inventory-before.txt"

          grep -F 'REWRITE_REMAINING_COUNT=164' "$RUNNER_TEMP/source-backed-inventory-before.txt"
          grep -F 'SOURCE_READY_COUNT=86' "$RUNNER_TEMP/source-backed-inventory-before.txt"
          grep -F 'SOURCE_READY_AUTHORITY_COUNTS={"STDLIB_API_AUTHORITY": 67, "THIRD_PARTY_API_AUTHORITY": 19}' \
            "$RUNNER_TEMP/source-backed-inventory-before.txt"
          grep -F 'SOURCE_REQUIRED_COUNT=78' "$RUNNER_TEMP/source-backed-inventory-before.txt"
          grep -F 'SOURCE_READY_SELECTION_SHA256=dc7a371eb8bbc91dd336461b1169e4ab4dcd55c5536f72e15f0e4d9e835c25d3' \
            "$RUNNER_TEMP/source-backed-inventory-before.txt"
          grep -F 'LESSON_EXPLANATION_SOURCE_BACKED_R1=PASS' \
            "$RUNNER_TEMP/source-backed-inventory-before.txt"

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOURCE_BRANCH: automation/lesson-explanation-source-backed-full-r1

    steps:
      - name: Check out full repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Require API key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Prepare clean full-batch branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null 2>&1; then
            echo "Full-batch branch already exists: $SOURCE_BRANCH"
            exit 1
          fi

          git checkout -b "$SOURCE_BRANCH" origin/main

      - name: Download resume provenance
        if: inputs.resume_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESUME_RUN_ID="${{ inputs.resume_run_id }}"
          if ! [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "resume_run_id must be numeric: $RESUME_RUN_ID"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/resume"
          gh run download "$RESUME_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name lesson-explanation-source-backed-full-r1 \
            --dir "$RUNNER_TEMP/resume"

          test -f "$RUNNER_TEMP/resume/lesson-explanation-source-backed-full-r1.jsonl"

      - name: Run complete 86-card source-backed batch
        shell: bash
        run: |
          set -euo pipefail
          RESUME_RUN_ID="${{ inputs.resume_run_id }}"

          ARGS=(
            --live
            --limit 86
            --model gpt-6.1-sol
            --result-path "$RUNNER_TEMP/lesson-explanation-source-backed-full-r1.jsonl"
            --hold-path "$RUNNER_TEMP/lesson-explanation-source-backed-full-r1-holds.jsonl"
            --max-total-tokens 5000000
            --max-holds 86
          )

          if [ -n "$RESUME_RUN_ID" ]; then
            ARGS+=(
              --resume-result-path
              "$RUNNER_TEMP/resume/lesson-explanation-source-backed-full-r1.jsonl"
            )
          fi

          python tools/run_lesson_explanation_source_backed_r1.py "${ARGS[@]}"

      - name: Require all 86 results and zero HOLD
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_count = 86
          expected_sha = "dc7a371eb8bbc91dd336461b1169e4ab4dcd55c5536f72e15f0e4d9e835c25d3"
          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-source-backed-full-r1.jsonl"
          hold_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-source-backed-full-r1-holds.jsonl"

          rows = [
              json.loads(line)
              for line in result_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          holds = []
          if hold_path.exists():
              holds = [
                  json.loads(line)
                  for line in hold_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]

          ids = [str(row.get("id") or "") for row in rows]
          if len(rows) != expected_count:
              raise SystemExit(f"expected {expected_count} successful results, got {len(rows)}")
          if len(set(ids)) != expected_count or any(not cid for cid in ids):
              raise SystemExit("full-batch result IDs are missing or duplicated")
          if holds:
              raise SystemExit(
                  f"full batch still has {len(holds)} HOLD rows: "
                  + ",".join(str(row.get("id") or "") for row in holds)
              )
          if any(str(row.get("selection_sha256") or "") != expected_sha for row in rows):
              raise SystemExit("full-batch selection SHA mismatch in result provenance")
          if any(not (row.get("web_sources") or []) for row in rows):
              raise SystemExit("one or more full-batch results are missing web-source provenance")
          if any(not str((row.get("quality") or {}).get("confidence") or "").strip() for row in rows):
              raise SystemExit("one or more full-batch results are missing quality confidence")

          print("SOURCE_BACKED_FULL_RESULT_COUNT=86")
          print("SOURCE_BACKED_FULL_HOLD_COUNT=0")
          print(f"SOURCE_BACKED_FULL_UNIQUE_ID_COUNT={len(set(ids))}")
          print("SOURCE_BACKED_FULL_PROVENANCE_GATE=PASS")
          PY

      - name: Rebuild runtime lesson bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Validate generated lessons and final rewrite inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py
          python tools/audit_explanation_readiness_r1.py --limit 0 \
            | tee "$RUNNER_TEMP/explanation-readiness-after.txt"
          python tools/plan_source_backed_explanation_r1.py --limit 0 \
            | tee "$RUNNER_TEMP/source-backed-plan-after.txt"

          grep -F 'REWRITE_REMAINING_COUNT=78' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SAFE_REMAINING_COUNT=0' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_READY_COUNT=0' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_REQUIRED_COUNT=78' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_REQUIRED_REASON_COUNTS={"AUTHORITY_SOURCE_REQUIRED": 14, "DOMAIN_CONTEXT_SOURCE_REQUIRED": 64}' \
            "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_REQUIRED_SELECTION_SHA256=615e839871f3e294340630d6871b57298f4c7bfa3b6b01d934c2e5bd51a37c46' \
            "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_BACKED_EXPLANATION_PLAN_R1=PASS' \
            "$RUNNER_TEMP/source-backed-plan-after.txt"

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-source-backed-full-r1.jsonl"
          rows = [
              json.loads(line)
              for line in result_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          allowed = {
              "data/runtime/lesson_bundle_v400_5.json",
              "data_i18n/en/runtime/lesson_bundle_v400_5.json",
          }
          for row in rows:
              filename = str(row["file"])
              allowed.add(f"data/lessons/{filename}")
              allowed.add(f"data_i18n/en/lessons/{filename}")

          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected changed files: {unexpected}")

          print(f"SOURCE_BACKED_FULL_CHANGED_FILE_COUNT={len(changed)}")
          print(f"SOURCE_BACKED_FULL_ALLOWED_FILE_COUNT={len(allowed)}")
          print("LESSON_EXPLANATION_SOURCE_BACKED_FULL_R1_DIFF_BOUNDARY=PASS")
          PY

          git diff --quiet -- \
            data/runtime/support_bundle_v400_5.json \
            data_i18n/en/runtime/support_bundle_v400_5.json
          git diff --check

      - name: Commit and push reviewed full-batch branch
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/lessons \
            data_i18n/en/lessons \
            data/runtime/lesson_bundle_v400_5.json \
            data_i18n/en/runtime/lesson_bundle_v400_5.json

          if git diff --cached --quiet; then
            echo "No source-backed full-batch changes to commit."
            exit 1
          fi

          git commit -m "Generate 86-card source-backed lesson explanations R1"
          git push -u origin "$SOURCE_BRANCH"
          echo "SOURCE_BACKED_FULL_BRANCH_READY=$SOURCE_BRANCH"

      - name: Upload full-batch provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lesson-explanation-source-backed-full-r1
          path: |
            ${{ runner.temp }}/lesson-explanation-source-backed-full-r1.jsonl
            ${{ runner.temp }}/lesson-explanation-source-backed-full-r1-holds.jsonl
            ${{ runner.temp }}/explanation-readiness-after.txt
            ${{ runner.temp }}/source-backed-plan-after.txt
          if-no-files-found: warn
          retention-days: 14
