name: learning-runtime-v348

on:
  push:
    branches:
      - agent/v348-runtime-refactor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v348-runtime-refactor:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V348 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/v348-runtime-refactor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply V348 runtime refactor
        run: python tools/apply_learning_runtime_refactor_v348.py --apply

      - name: Confirm V348 runtime refactor idempotence
        run: python tools/apply_learning_runtime_refactor_v348.py --check

      - name: Apply V348 attempt snapshot hardening
        run: python tools/apply_learning_runtime_refactor_v348_r2.py --apply

      - name: Confirm V348 attempt snapshot hardening idempotence
        run: python tools/apply_learning_runtime_refactor_v348_r2.py --check

      - name: Apply V348 dialog focus hardening
        run: python tools/apply_learning_runtime_refactor_v348_r3.py --apply

      - name: Confirm V348 dialog focus hardening idempotence
        run: python tools/apply_learning_runtime_refactor_v348_r3.py --check

      - name: V348 syntax checks
        run: |
          python -m py_compile tools/apply_learning_runtime_refactor_v348.py tools/apply_learning_runtime_refactor_v348_r2.py tools/apply_learning_runtime_refactor_v348_r3.py
          node --check src/pwa/learning_runtime_v348.js
          node --check src/pwa/learning_flow_hardening_v347.js
          node --check tools/audit_learning_runtime_v348.js

      - name: Existing lesson validation
        run: python tools/validate_lessons.py

      - name: Existing V339 content quality
        run: |
          python tools/content_quality_final_pass_v339.py --check
          python tools/content_quality_final_pass_v339_r2.py --check
          python tools/content_quality_final_pass_v339_r4.py --check
          node tools/audit_content_semantic_alignment_v339_r4.js

      - name: Existing V340 learning loop
        run: node tools/audit_learning_loop_v340.js

      - name: Existing V341 learning experience
        run: |
          node tools/audit_learning_experience_v341.js
          node tools/audit_learning_experience_v341_r2.js
          python tools/audit_development_workflow_sidecards_v341_a2.py
          python tools/audit_sidecard_educational_quality_v341.py

      - name: Existing V342 hardening
        run: node tools/audit_learning_hardening_v342_r2.js

      - name: Existing V343 context review
        run: python tools/content_context_review_v343.py --check

      - name: Existing V344 explanation quality
        run: |
          python tools/apply_explanation_quality_v344_r2.py --check
          python tools/apply_explanation_support_v344_r3.py --check
          python tools/apply_explanation_support_v344_r4.py --check
          python tools/apply_explanation_support_v344_r5.py --check
          node tools/audit_explanation_quality_v344.js

      - name: Existing V345 study experience
        run: |
          python tools/apply_study_experience_v345.py --check
          python tools/apply_study_experience_v345_r2.py --check
          node tools/audit_study_experience_v345.js

      - name: Existing V346 study quality
        run: |
          python tools/apply_study_quality_v346.py --check
          python tools/apply_study_quality_v346_r2.py --check
          python tools/apply_study_quality_v346_r3.py --check
          python tools/repair_future_terminology_v346.py --check
          node tools/audit_study_quality_v346.js
          python tools/audit_terminology_guard_v346.py

      - name: V348 refactor contract audit
        run: node tools/audit_learning_runtime_v348.js

      - name: Diff integrity
        run: git diff --check

      - name: V343 through V346 real browser regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v348-regression-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then break; fi
            sleep 0.1
          done
          node tools/run_learning_home_v343_browser_smoke.js
          node tools/run_explanation_quality_v344_browser_smoke.js
          node tools/run_study_experience_v345_browser_smoke.js
          node tools/run_study_quality_v346_browser_smoke.js

      - name: V347 end-to-end journey on V348 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v348-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then break; fi
            sleep 0.1
          done
          node tools/run_e2e_learning_flow_v347_browser_smoke.js

      - name: Commit V348 generated integration if needed
        if: success()
        run: |
          if git diff --quiet; then
            echo "V348_ALREADY_CLEAN=True"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pwa/index.html src/pwa/learning_loop_v340.js src/pwa/learning_experience_v341.js src/pwa/study_experience_v345.js src/pwa/study_progress_v346.js src/pwa/learning_flow_hardening_v347.js src/pwa/learning_runtime_v348.js
          git commit -m "Apply V348 shared learning runtime refactor"
          git push origin HEAD:agent/v348-runtime-refactor
          echo "V348_CHANGES_PUSHED=True"
