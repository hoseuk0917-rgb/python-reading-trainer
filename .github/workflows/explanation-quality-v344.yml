name: explanation-quality-v344

on:
  push:
    branches:
      - feat/explanation-quality-v344
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v344-explanation-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V344 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/explanation-quality-v344

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply V344 explanation quality
        run: python tools/apply_explanation_quality_v344_r2.py --apply

      - name: Confirm V344 patch idempotence
        run: python tools/apply_explanation_quality_v344_r2.py --check

      - name: Apply V344 refresher runtime hardening
        run: python tools/apply_explanation_support_v344_r3.py --apply

      - name: Confirm refresher runtime idempotence
        run: python tools/apply_explanation_support_v344_r3.py --check

      - name: Apply robust V344 focus restoration
        run: python tools/apply_explanation_support_v344_r4.py --apply

      - name: Confirm focus restoration idempotence
        run: python tools/apply_explanation_support_v344_r4.py --check

      - name: JavaScript syntax
        run: |
          node --check src/pwa/explanation_support_v344.js
          node --check tools/audit_explanation_quality_v344.js
          node --check tools/explanation_quality_v344_browser_case.js
          node --check tools/run_explanation_quality_v344_browser_smoke.js
          node --check src/pwa/app.js
          node --check src/pwa/code_explainer.js

      - name: V344 explanation contract audit
        run: node tools/audit_explanation_quality_v344.js

      - name: Existing lesson validation
        run: python tools/validate_lessons.py

      - name: Existing V339 content quality gates
        run: |
          python tools/content_quality_final_pass_v339.py --check
          python tools/content_quality_final_pass_v339_r2.py --check
          python tools/content_quality_final_pass_v339_r4.py --check
          node tools/audit_content_semantic_alignment_v339_r4.js

      - name: Existing V340 learning regression
        run: node tools/audit_learning_loop_v340.js

      - name: Existing V341 learning experience regression
        run: |
          node tools/audit_learning_experience_v341.js
          node tools/audit_learning_experience_v341_r2.js
          python tools/audit_development_workflow_sidecards_v341_a2.py
          python tools/audit_sidecard_educational_quality_v341.py

      - name: Existing V342 hardening regression
        run: node tools/audit_learning_hardening_v342_r2.js

      - name: Existing V343 corpus regression
        run: |
          python tools/content_context_review_v343.py --check
          node --check src/pwa/learning_home_v343.js

      - name: Existing explainer V323 V324 regression
        run: |
          node tools/smoke_explainer_regression_v323_a6.js
          node tools/quality_gate_explainer_v324_a1.js

      - name: Diff integrity
        run: git diff --check

      - name: V343 real browser home regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v343-v344-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then break; fi
            sleep 0.1
          done
          node tools/run_learning_home_v343_browser_smoke.js

      - name: V344 real browser explanation smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v344-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then break; fi
            sleep 0.1
          done
          node tools/run_explanation_quality_v344_browser_smoke.js

      - name: Commit V344 generated changes if needed
        run: |
          if git diff --quiet; then
            echo "V344_ALREADY_CLEAN=True"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pwa/app.js src/pwa/index.html src/pwa/explanation_support_v344.js
          git commit -m "Apply V344 explanation quality contract"
          git push origin HEAD:feat/explanation-quality-v344
          echo "V344_CHANGES_PUSHED=True"
