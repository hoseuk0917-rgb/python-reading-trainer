name: Lesson explanation source-mapping review classifier R1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/classify_source_mapping_review_r1.py'
      - 'tools/classify_domain_provenance_review_r1.py'
      - 'tools/verify_source_mapping_resolution_r1.py'
      - 'tools/audit_explanation_readiness_r1.py'
      - 'tools/audit_source_bundle_mapping_r1.py'
      - '.github/workflows/lesson-explanation-source-mapping-review-r1.yml'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile provenance tooling
        run: |
          python -m py_compile tools/classify_source_mapping_review_r1.py
          python -m py_compile tools/classify_domain_provenance_review_r1.py
          python -m py_compile tools/verify_source_mapping_resolution_r1.py

      - name: Replay frozen 93-card review inventory
        run: python tools/classify_source_mapping_review_r1.py --limit 200

      - name: Replay second-stage domain provenance review
        run: python tools/classify_domain_provenance_review_r1.py --limit 120

      - name: Verify final source-mapping resolution
        run: python tools/verify_source_mapping_resolution_r1.py --limit 120
