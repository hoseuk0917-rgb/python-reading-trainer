name: Content quality final pass

on:
  push:
    branches:
      - feat/content-quality-final-pass

permissions:
  contents: write

jobs:
  quality-final-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout quality branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/content-quality-final-pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic corpus repairs
        run: python tools/content_quality_final_pass_v339.py --apply

      - name: Apply beginner-density and semantic dedupe repairs
        run: python tools/content_quality_final_pass_v339_r2.py --apply

      - name: Check PWA JavaScript syntax
        run: node --check src/pwa/app.js

      - name: Run existing lesson validation
        run: python tools/validate_lessons.py

      - name: Run corpus quality audit
        run: python tools/content_quality_final_pass_v339.py --check

      - name: Run beginner-density quality audit
        run: python tools/content_quality_final_pass_v339_r2.py --check

      - name: Commit repaired corpus when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "QUALITY_CORPUS_ALREADY_CLEAN=True"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data data_i18n src/pwa/app.js src/pwa/index.html
          git commit -m "Apply final beginner content quality pass"
          git push origin HEAD:feat/content-quality-final-pass
          echo "QUALITY_CORPUS_COMMIT_PUSHED=True"
