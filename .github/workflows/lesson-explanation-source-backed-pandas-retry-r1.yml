name: Lesson explanation source-backed pandas retry R1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/audit_source_bundle_mapping_r1.py'
      - 'tools/plan_source_backed_explanation_r1.py'
      - 'tools/run_lesson_explanation_source_backed_r1.py'
      - '.github/workflows/lesson-explanation-source-backed-pandas-retry-r1.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Retry only PY42_L07_read_csv_sep_001 with the exact pandas.read_csv authority source'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: lesson-explanation-source-backed-pandas-retry-r1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile source-backed tooling
        run: |
          python -m py_compile tools/audit_source_bundle_mapping_r1.py
          python -m py_compile tools/plan_source_backed_explanation_r1.py
          python -m py_compile tools/run_lesson_explanation_source_backed_r1.py

      - name: Audit source mapping
        run: python tools/audit_source_bundle_mapping_r1.py --limit 0

      - name: Verify exact pandas one-card plan
        shell: bash
        run: |
          set -euo pipefail
          CARD_ID='PY42_L07_read_csv_sep_001'
          python tools/run_lesson_explanation_source_backed_r1.py             --plan             --limit 1             --selection-ids "$CARD_ID"             | tee "$RUNNER_TEMP/pandas-retry-plan.txt"

          grep -F 'SOURCE_BACKED_LIMIT=1' "$RUNNER_TEMP/pandas-retry-plan.txt"
          grep -F 'SOURCE_BACKED_EXPLICIT_SELECTION=YES' "$RUNNER_TEMP/pandas-retry-plan.txt"
          grep -F 'SOURCE_BACKED_SELECTION_SHA256=4eb9b27dfa09553d41241a9dc280d2957b561b7ed090cb417af3be75d3df5585'             "$RUNNER_TEMP/pandas-retry-plan.txt"
          grep -F 'PY42_L07_read_csv_sep_001' "$RUNNER_TEMP/pandas-retry-plan.txt"
          grep -F 'pandas.pydata.org' "$RUNNER_TEMP/pandas-retry-plan.txt"
          grep -F 'LESSON_EXPLANATION_SOURCE_BACKED_R1_PLAN=PASS' "$RUNNER_TEMP/pandas-retry-plan.txt"

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOURCE_BRANCH: automation/lesson-explanation-source-backed-pandas-retry-r1

    steps:
      - name: Check out full repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Require API key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Prepare clean pandas retry branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null 2>&1; then
            echo "Pandas retry branch already exists: $SOURCE_BRANCH"
            exit 1
          fi

          git checkout -b "$SOURCE_BRANCH" origin/main

      - name: Run pandas one-card source-backed retry
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_lesson_explanation_source_backed_r1.py             --live             --limit 1             --selection-ids PY42_L07_read_csv_sep_001             --model gpt-6.1-sol             --result-path "$RUNNER_TEMP/lesson-explanation-source-backed-pandas-retry-r1.jsonl"             --hold-path "$RUNNER_TEMP/lesson-explanation-source-backed-pandas-retry-r1-holds.jsonl"             --max-total-tokens 120000             --max-holds 1

      - name: Require result one and HOLD zero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-source-backed-pandas-retry-r1.jsonl"
          hold_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-source-backed-pandas-retry-r1-holds.jsonl"

          rows = [
              json.loads(line)
              for line in result_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          holds = []
          if hold_path.exists():
              holds = [
                  json.loads(line)
                  for line in hold_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]

          if len(rows) != 1:
              raise SystemExit(f"expected exactly one successful result, got {len(rows)}")
          if str(rows[0].get("id") or "") != "PY42_L07_read_csv_sep_001":
              raise SystemExit(f"unexpected result id: {rows[0].get('id')}")
          if holds:
              raise SystemExit(f"pandas retry still has HOLD rows: {[row.get('id') for row in holds]}")
          if not any("pandas.pydata.org/docs/reference/api/pandas.read_csv.html" in str(url) for url in rows[0].get("web_sources") or []):
              raise SystemExit("exact pandas.read_csv authority URL was not observed in web sources")

          print("SOURCE_BACKED_PANDAS_RETRY_RESULT_COUNT=1")
          print("SOURCE_BACKED_PANDAS_RETRY_HOLD_COUNT=0")
          print("SOURCE_BACKED_PANDAS_READ_CSV_AUTHORITY=PASS")
          PY

      - name: Rebuild runtime lesson bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Validate generated lessons
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py
          python tools/audit_explanation_readiness_r1.py --limit 0             | tee "$RUNNER_TEMP/explanation-readiness-after.txt"
          python tools/plan_source_backed_explanation_r1.py --limit 0             | tee "$RUNNER_TEMP/source-backed-plan-after.txt"

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-source-backed-pandas-retry-r1.jsonl"
          row = json.loads(result_path.read_text(encoding="utf-8").strip())

          allowed = {
              f"data/lessons/{row['file']}",
              f"data_i18n/en/lessons/{row['file']}",
              "data/runtime/lesson_bundle_v400_5.json",
              "data_i18n/en/runtime/lesson_bundle_v400_5.json",
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected changed files: {unexpected}")

          print(f"SOURCE_BACKED_PANDAS_CHANGED_FILE_COUNT={len(changed)}")
          print("LESSON_EXPLANATION_SOURCE_BACKED_PANDAS_RETRY_R1_DIFF_BOUNDARY=PASS")
          PY

          git diff --quiet --             data/runtime/support_bundle_v400_5.json             data_i18n/en/runtime/support_bundle_v400_5.json
          git diff --check

      - name: Commit and push reviewed pandas retry branch
        shell: bash
        run: |
          set -euo pipefail
          git add             data/lessons             data_i18n/en/lessons             data/runtime/lesson_bundle_v400_5.json             data_i18n/en/runtime/lesson_bundle_v400_5.json

          if git diff --cached --quiet; then
            echo "No pandas retry changes to commit."
            exit 1
          fi

          git commit -m "Complete pandas read_csv source-backed lesson explanation R1"
          git push -u origin "$SOURCE_BRANCH"
          echo "SOURCE_BACKED_PANDAS_RETRY_BRANCH_READY=$SOURCE_BRANCH"

      - name: Upload pandas retry provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lesson-explanation-source-backed-pandas-retry-r1
          path: |
            ${{ runner.temp }}/lesson-explanation-source-backed-pandas-retry-r1.jsonl
            ${{ runner.temp }}/lesson-explanation-source-backed-pandas-retry-r1-holds.jsonl
            ${{ runner.temp }}/explanation-readiness-after.txt
            ${{ runner.temp }}/source-backed-plan-after.txt
          if-no-files-found: warn
          retention-days: 14
