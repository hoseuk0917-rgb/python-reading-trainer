name: Lesson explanation local-evidence full batch R1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/run_lesson_explanation_api_pilot_r1.py'
      - 'tools/plan_local_evidence_full_r1.py'
      - 'tools/plan_source_backed_explanation_r1.py'
      - 'tools/audit_explanation_readiness_r1.py'
      - 'docs/LESSON_EXPLANATION_CONTRACT_V1.md'
      - '.github/workflows/lesson-explanation-local-evidence-full-r1.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the frozen 68-card LOCAL EVIDENCE full batch'
        required: false
        default: false
        type: boolean
      resume_run_id:
        description: 'Optional failed full-batch run ID whose validated results should be resumed'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: lesson-explanation-local-evidence-full-r1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile local-evidence tooling
        run: |
          python -m py_compile tools/run_lesson_explanation_api_pilot_r1.py
          python -m py_compile tools/plan_local_evidence_full_r1.py

      - name: Runner self-test
        run: python tools/run_lesson_explanation_api_pilot_r1.py --self-test

      - name: Verify frozen 68-card full-batch selection
        shell: bash
        run: |
          set -euo pipefail
          python tools/plan_local_evidence_full_r1.py --limit 100 \
            | tee "$RUNNER_TEMP/local-evidence-full-plan.txt"

          grep -F 'CARD_COUNT=1785' "$RUNNER_TEMP/local-evidence-full-plan.txt"
          grep -F 'LOCAL_EVIDENCE_COUNT=68' "$RUNNER_TEMP/local-evidence-full-plan.txt"
          grep -F 'LOCAL_EVIDENCE_FULL_PLAN_R1=PASS' "$RUNNER_TEMP/local-evidence-full-plan.txt"

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FULL_BRANCH: automation/lesson-explanation-local-evidence-full-r1

    steps:
      - name: Check out full repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Require API key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Prepare clean full-batch branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$FULL_BRANCH" >/dev/null 2>&1; then
            echo "Local-evidence full-batch branch already exists: $FULL_BRANCH"
            exit 1
          fi

          git checkout -b "$FULL_BRANCH" origin/main

      - name: Download resume provenance
        if: inputs.resume_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESUME_RUN_ID="${{ inputs.resume_run_id }}"
          if ! [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "resume_run_id must be numeric: $RESUME_RUN_ID"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/resume"
          gh run download "$RESUME_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name lesson-explanation-local-evidence-full-r1 \
            --dir "$RUNNER_TEMP/resume"

          test -f "$RUNNER_TEMP/resume/lesson-explanation-local-evidence-full-r1.jsonl"

      - name: Run complete 68-card local-evidence batch
        shell: bash
        run: |
          set -euo pipefail
          IDS="$(python tools/plan_local_evidence_full_r1.py --ids-only)"
          COUNT="$(printf '%s' "$IDS" | awk -F',' '{print NF}')"
          if [ "$COUNT" -ne 68 ]; then
            echo "expected 68 IDs, got $COUNT"
            exit 1
          fi

          ARGS=(
            --live
            --limit 68
            --selection-ids "$IDS"
            --model gpt-6.1-sol
            --result-path "$RUNNER_TEMP/lesson-explanation-local-evidence-full-r1.jsonl"
            --hold-path "$RUNNER_TEMP/lesson-explanation-local-evidence-full-r1-holds.jsonl"
            --max-total-tokens 1500000
            --max-holds 68
          )

          if [ -n "${{ inputs.resume_run_id }}" ]; then
            ARGS+=(
              --resume-result-path
              "$RUNNER_TEMP/resume/lesson-explanation-local-evidence-full-r1.jsonl"
            )
          fi

          python tools/run_lesson_explanation_api_pilot_r1.py "${ARGS[@]}"

      - name: Require all 68 results and zero HOLD
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-local-evidence-full-r1.jsonl"
          hold_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-local-evidence-full-r1-holds.jsonl"

          rows = [
              json.loads(line)
              for line in result_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          holds = []
          if hold_path.exists():
              holds = [
                  json.loads(line)
                  for line in hold_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]

          if len(rows) != 68:
              raise SystemExit(f"expected 68 successful results, got {len(rows)}")
          if len({str(row.get("id") or "") for row in rows}) != 68:
              raise SystemExit("local-evidence full result IDs are missing or duplicated")
          if holds:
              raise SystemExit(
                  "local-evidence full HOLD rows: "
                  + ",".join(str(row.get("id") or "") for row in holds)
              )
          non_high = [
              str(row.get("id") or "")
              for row in rows
              if (row.get("quality") or {}).get("confidence") != "HIGH"
          ]
          if non_high:
              raise SystemExit("local-evidence full non-HIGH rows: " + ",".join(non_high))

          selection_shas = {str(row.get("selection_sha256") or "") for row in rows}
          if len(selection_shas) != 1 or "" in selection_shas:
              raise SystemExit(f"selection SHA mismatch in results: {selection_shas}")

          print("LOCAL_EVIDENCE_FULL_RESULT_COUNT=68")
          print("LOCAL_EVIDENCE_FULL_HOLD_COUNT=0")
          print("LOCAL_EVIDENCE_FULL_CONFIDENCE_HIGH=68")
          print("LOCAL_EVIDENCE_FULL_SELECTION_SHA256=" + next(iter(selection_shas)))
          print("LOCAL_EVIDENCE_FULL_RESULT_GATE=PASS")
          PY

      - name: Rebuild runtime lesson bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Validate generated lessons and final rewrite inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py
          python tools/audit_explanation_readiness_r1.py --limit 0 \
            | tee "$RUNNER_TEMP/explanation-readiness-after.txt"
          python tools/plan_source_backed_explanation_r1.py --limit 0 \
            | tee "$RUNNER_TEMP/source-backed-plan-after.txt"

          grep -F 'REWRITE_REMAINING_COUNT=0' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SAFE_REMAINING_COUNT=0' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_READY_COUNT=0' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_REQUIRED_COUNT=0' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_BACKED_EXPLANATION_PLAN_R1=PASS' "$RUNNER_TEMP/source-backed-plan-after.txt"

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-local-evidence-full-r1.jsonl"
          rows = [
              json.loads(line)
              for line in result_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          allowed = {
              "data/runtime/lesson_bundle_v400_5.json",
              "data_i18n/en/runtime/lesson_bundle_v400_5.json",
          }
          for row in rows:
              filename = str(row["file"])
              allowed.add(f"data/lessons/{filename}")
              allowed.add(f"data_i18n/en/lessons/{filename}")

          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected changed files: {unexpected}")

          print(f"LOCAL_EVIDENCE_FULL_CHANGED_FILE_COUNT={len(changed)}")
          print(f"LOCAL_EVIDENCE_FULL_ALLOWED_FILE_COUNT={len(allowed)}")
          print("LESSON_EXPLANATION_LOCAL_EVIDENCE_FULL_R1_DIFF_BOUNDARY=PASS")
          PY

          git diff --quiet -- \
            data/runtime/support_bundle_v400_5.json \
            data_i18n/en/runtime/support_bundle_v400_5.json
          git diff --check

      - name: Commit and push reviewed full-batch branch
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/lessons \
            data_i18n/en/lessons \
            data/runtime/lesson_bundle_v400_5.json \
            data_i18n/en/runtime/lesson_bundle_v400_5.json

          if git diff --cached --quiet; then
            echo "No local-evidence full-batch changes to commit."
            exit 1
          fi

          git commit -m "Generate remaining 68 local-evidence lesson explanations R1"
          git push -u origin "$FULL_BRANCH"
          echo "LOCAL_EVIDENCE_FULL_BRANCH_READY=$FULL_BRANCH"

      - name: Upload full-batch provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lesson-explanation-local-evidence-full-r1
          path: |
            ${{ runner.temp }}/lesson-explanation-local-evidence-full-r1.jsonl
            ${{ runner.temp }}/lesson-explanation-local-evidence-full-r1-holds.jsonl
            ${{ runner.temp }}/explanation-readiness-after.txt
            ${{ runner.temp }}/source-backed-plan-after.txt
          if-no-files-found: warn
          retention-days: 14
