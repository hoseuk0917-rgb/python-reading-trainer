name: clarity-inventory-v356

on:
  push:
    branches:
      - agent/v356-line-by-line-beginner-clarity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v356-line-by-line-beginner-clarity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print exact level inventory
        run: python tools/inventory_clarity_levels_v356.py
