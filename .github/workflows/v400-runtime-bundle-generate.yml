name: V400 runtime content bundle generate

on:
  push:
    branches:
      - main
    paths:
      - tools/build_runtime_lesson_bundle_v400_5.py
      - .github/workflows/v400-runtime-bundle-generate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build KO and EN runtime bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Validate bundle JSON
        run: |
          python -m json.tool data/runtime/lesson_bundle_v400_5.json >/dev/null
          python -m json.tool data_i18n/en/runtime/lesson_bundle_v400_5.json >/dev/null
          python -m json.tool data/runtime/support_bundle_v400_5.json >/dev/null
          python -m json.tool data_i18n/en/runtime/support_bundle_v400_5.json >/dev/null

      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/runtime/lesson_bundle_v400_5.json data_i18n/en/runtime/lesson_bundle_v400_5.json data/runtime/support_bundle_v400_5.json data_i18n/en/runtime/support_bundle_v400_5.json
          if git diff --cached --quiet; then
            echo "RUNTIME_BUNDLE_CHANGED=False"
            exit 0
          fi
          git commit -m "V400.5: generate runtime content bundles"
          git push origin HEAD:main
          echo "RUNTIME_BUNDLE_CHANGED=True"
