name: One-off V400.8 semantic residual scan

on:
  push:
    branches: [main]
    paths: [".github/workflows/oneoff-v4008-semantic-residual-scan.yml"]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan learner-visible L1-L3 text
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path.cwd()
          ko=json.loads((root/'data/runtime/lesson_bundle_v400_5.json').read_text(encoding='utf-8'))
          en=json.loads((root/'data_i18n/en/runtime/lesson_bundle_v400_5.json').read_text(encoding='utf-8'))

          def cards(bundle):
              for rel,rows in bundle['files'].items():
                  for card in rows:
                      try: level=int(card.get('level',999))
                      except: level=999
                      if level<=3: yield rel,card

          def fields(card):
              out=[]
              for key in ('title','question','project_context'):
                  if isinstance(card.get(key),str): out.append((key,card[key]))
              for i,v in enumerate(card.get('choices') or []):
                  if isinstance(v,str): out.append((f'choices[{i}]',v))
              def walk(node,path):
                  if isinstance(node,str):
                      if not path.endswith('.code'): out.append((path,node))
                  elif isinstance(node,dict):
                      for k,v in node.items(): walk(v,f'{path}.{k}')
                  elif isinstance(node,list):
                      for i,v in enumerate(node): walk(v,f'{path}[{i}]')
              for sec in ('concept_explanation','teaching_example','answer_explanation'): walk(card.get(sec),sec)
              return out

          specs={
            'en_hangul': lambda s: bool(re.search(r'[가-힣]',s)),
            'en_double_backtick': lambda s: '``' in s,
            'en_focus_expression': lambda s: bool(re.search(r'\bfocus expression\b',s,re.I)),
            'en_leading_code_fragment': lambda s: bool(re.match(r'^`[^`]+`\s+(?:As you can see|When I look|What |It[’\x27]s |It is |This is |If |The |Since )',s)),
            'en_suspicious_like': lambda s: 'inside `like`' in s or 'variable "."' in s or 'and  as being' in s,
            'ko_focus_expression': lambda s: 'focus 표현식' in s,
            'ko_internal_template': lambda s: bool(re.search(r'이번 카드는\s+[A-Za-z_]+\s+문법을 읽는다',s)),
            'ko_author_token': lambda s: bool(re.search(r'\b(?:name_reference|subscription|if_statement|else_clause|for_statement|return_statement|attribute_access|argument_passing|parameter_definition|membership_test|identity_test|sequence_operation)\b',s)),
          }
          report={'schema':'python-reading-trainer/v4008-semantic-residual-scan-v1','ko_card_count':ko['card_count'],'en_card_count':en['card_count'],'scope':'learner-visible structured fields on all Level 1-3 lesson cards','counts':{},'samples':{}}
          for name,fn in specs.items():
              report['counts'][name]=0; report['samples'][name]=[]
          for lang,bundle in [('en',en),('ko',ko)]:
              for rel,card in cards(bundle):
                  for field,value in fields(card):
                      for name,fn in specs.items():
                          if not name.startswith(lang+'_'): continue
                          if fn(value):
                              report['counts'][name]+=1
                              if len(report['samples'][name])<80:
                                  report['samples'][name].append({'file':rel,'id':card.get('id'),'field':field,'sample':value[:350]})
          out=root/'docs/audits/v4008_semantic_residual_scan.json'; out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SEMANTIC_RESIDUAL_COUNTS='+json.dumps(report['counts'],ensure_ascii=False,separators=(',',':')))
          (root/'.github/workflows/oneoff-v4008-semantic-residual-scan.yml').unlink()
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record beginner semantic residual scan"
          git push origin HEAD:main
