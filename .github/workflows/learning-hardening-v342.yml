name: learning-hardening-v342

on:
  push:
    branches:
      - feat/final-learning-hardening-v342
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learning-hardening-v342:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V342 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/final-learning-hardening-v342

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply prototype-safe semantic lookup
        run: python tools/apply_semantic_lookup_hardening_v342.py --apply

      - name: Confirm semantic lookup idempotence
        run: python tools/apply_semantic_lookup_hardening_v342.py --check

      - name: Apply V342 learning runtime hardening
        run: python tools/apply_learning_hardening_v342.py --apply

      - name: Confirm V342 learning hardening idempotence
        run: python tools/apply_learning_hardening_v342.py --check

      - name: Apply balanced checkpoint rotation
        run: python tools/apply_learning_hardening_v342_r2.py --apply

      - name: Confirm balanced checkpoint rotation idempotence
        run: python tools/apply_learning_hardening_v342_r2.py --check

      - name: JavaScript syntax
        run: |
          node --check src/pwa/content_quality_semantics.js
          node --check src/pwa/learning_engine_v341.js
          node --check src/pwa/learning_experience_v341.js
          node --check tools/audit_learning_hardening_v342_r2.js
          node --check tools/run_learning_hardening_v342_browser_smoke.js

      - name: V342 full curriculum hardening audit
        run: node tools/audit_learning_hardening_v342_r2.js

      - name: Existing V341 audits
        run: |
          node tools/audit_learning_experience_v341.js
          node tools/audit_learning_experience_v341_r2.js
          python tools/audit_development_workflow_sidecards_v341_a2.py
          python tools/audit_sidecard_educational_quality_v341.py

      - name: Existing V340 learning regression
        run: node tools/audit_learning_loop_v340.js

      - name: Existing lesson validation
        run: python tools/validate_lessons.py

      - name: Existing V339 content quality gates
        run: |
          python tools/content_quality_final_pass_v339.py --check
          python tools/content_quality_final_pass_v339_r2.py --check
          python tools/content_quality_final_pass_v339_r4.py --check
          node tools/audit_content_semantic_alignment_v339_r4.js

      - name: Diff integrity
        run: git diff --check

      - name: V342 existing-user and final-checkpoint real-browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v342-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then
              break
            fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:3377/tools/learning_hardening_v342_browser_case.html > /dev/null
          node tools/run_learning_hardening_v342_browser_smoke.js

      - name: Commit hardening changes if needed
        run: |
          if git diff --quiet; then
            echo "V342_HARDENING_ALREADY_CLEAN=True"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pwa/content_quality_semantics.js src/pwa/index.html src/pwa/learning_engine_v341.js src/pwa/learning_experience_v341.js
          git commit -m "Harden V342 learning runtime"
          git push origin HEAD:feat/final-learning-hardening-v342
          echo "V342_HARDENING_COMMIT_PUSHED=True"
