name: Lesson explanation local-evidence canary R1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/run_lesson_explanation_api_pilot_r1.py'
      - 'tools/audit_explanation_readiness_r1.py'
      - 'docs/LESSON_EXPLANATION_CONTRACT_V1.md'
      - '.github/workflows/lesson-explanation-local-evidence-canary-r1.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the frozen 10-card LOCAL EVIDENCE canary'
        required: false
        default: false
        type: boolean
      resume_run_id:
        description: 'Optional failed canary run ID whose validated results should be resumed'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: lesson-explanation-local-evidence-canary-r1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      CANARY_IDS: >-
        PY12_L08_model_to_device_001,
        PY121_L04_STATUS_CODE_BASIC_001,
        PY_L10_async_001,
        PY104_L04_EXCEPTION_RAISE_001,
        PY34_L06_smoke_test_001,
        PY46_L09_progress_log_001,
        PY51_L09_service_worker_waiting_001,
        PY22_L10_oauth_callback_001,
        PY9_REVIEW_FASTAPI_001,
        PY9_REVIEW_RAG_006

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile runner
        run: python -m py_compile tools/run_lesson_explanation_api_pilot_r1.py

      - name: Runner self-test
        run: python tools/run_lesson_explanation_api_pilot_r1.py --self-test

      - name: Verify frozen 10-card local-evidence plan
        shell: bash
        run: |
          set -euo pipefail
          IDS="$(echo "$CANARY_IDS" | tr -d '[:space:]')"
          python tools/run_lesson_explanation_api_pilot_r1.py \
            --plan \
            --limit 10 \
            --selection-ids "$IDS" \
            | tee "$RUNNER_TEMP/local-evidence-canary-plan.txt"

          grep -F 'PILOT_LIMIT=10' "$RUNNER_TEMP/local-evidence-canary-plan.txt"
          grep -F 'PILOT_EXPLICIT_SELECTION=YES' "$RUNNER_TEMP/local-evidence-canary-plan.txt"
          grep -F 'PILOT_DISPOSITION_COUNTS={"CONCEPT_EXPLANATION_REWRITE": 5, "WALKTHROUGH_OR_ANSWER_REWRITE": 5}' \
            "$RUNNER_TEMP/local-evidence-canary-plan.txt"
          grep -F 'PILOT_AUTHORITY_COUNTS={"AUTHORITY_REVIEW": 1, "DOMAIN_AUTHORITY_REVIEW": 9}' \
            "$RUNNER_TEMP/local-evidence-canary-plan.txt"
          grep -F 'PILOT_SELECTION_SHA256=6c0eaf42a5c2dfd42c2835c355f2470b8886cb47fd93a27340e02041b38f63a1' \
            "$RUNNER_TEMP/local-evidence-canary-plan.txt"
          grep -F 'LESSON_EXPLANATION_API_PILOT_R1_PLAN=PASS' \
            "$RUNNER_TEMP/local-evidence-canary-plan.txt"

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CANARY_BRANCH: automation/lesson-explanation-local-evidence-canary-r1
      CANARY_IDS: >-
        PY12_L08_model_to_device_001,
        PY121_L04_STATUS_CODE_BASIC_001,
        PY_L10_async_001,
        PY104_L04_EXCEPTION_RAISE_001,
        PY34_L06_smoke_test_001,
        PY46_L09_progress_log_001,
        PY51_L09_service_worker_waiting_001,
        PY22_L10_oauth_callback_001,
        PY9_REVIEW_FASTAPI_001,
        PY9_REVIEW_RAG_006

    steps:
      - name: Check out full repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Require API key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Prepare clean local-evidence canary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$CANARY_BRANCH" >/dev/null 2>&1; then
            echo "Local-evidence canary branch already exists: $CANARY_BRANCH"
            exit 1
          fi

          git checkout -b "$CANARY_BRANCH" origin/main

      - name: Download resume provenance
        if: inputs.resume_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESUME_RUN_ID="${{ inputs.resume_run_id }}"
          if ! [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "resume_run_id must be numeric: $RESUME_RUN_ID"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/resume"
          gh run download "$RESUME_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name lesson-explanation-local-evidence-canary-r1 \
            --dir "$RUNNER_TEMP/resume"

          test -f "$RUNNER_TEMP/resume/lesson-explanation-local-evidence-canary-r1.jsonl"

      - name: Run frozen 10-card local-evidence canary
        shell: bash
        run: |
          set -euo pipefail
          IDS="$(echo "$CANARY_IDS" | tr -d '[:space:]')"
          ARGS=(
            --live
            --limit 10
            --selection-ids "$IDS"
            --model gpt-6.1-sol
            --result-path "$RUNNER_TEMP/lesson-explanation-local-evidence-canary-r1.jsonl"
            --hold-path "$RUNNER_TEMP/lesson-explanation-local-evidence-canary-r1-holds.jsonl"
            --max-total-tokens 300000
            --max-holds 10
          )

          if [ -n "${{ inputs.resume_run_id }}" ]; then
            ARGS+=(
              --resume-result-path
              "$RUNNER_TEMP/resume/lesson-explanation-local-evidence-canary-r1.jsonl"
            )
          fi

          python tools/run_lesson_explanation_api_pilot_r1.py "${ARGS[@]}"

      - name: Require result ten and HOLD zero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-local-evidence-canary-r1.jsonl"
          hold_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-local-evidence-canary-r1-holds.jsonl"

          rows = [
              json.loads(line)
              for line in result_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          holds = []
          if hold_path.exists():
              holds = [
                  json.loads(line)
                  for line in hold_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]

          if len(rows) != 10:
              raise SystemExit(f"expected 10 successful results, got {len(rows)}")
          if holds:
              raise SystemExit(
                  "local-evidence canary HOLD rows: "
                  + ",".join(str(row.get("id") or "") for row in holds)
              )
          if len({str(row.get("id") or "") for row in rows}) != 10:
              raise SystemExit("local-evidence canary result IDs are missing or duplicated")
          if any((row.get("quality") or {}).get("confidence") != "HIGH" for row in rows):
              raise SystemExit("local-evidence canary requires HIGH confidence for all rows")

          print("LOCAL_EVIDENCE_CANARY_RESULT_COUNT=10")
          print("LOCAL_EVIDENCE_CANARY_HOLD_COUNT=0")
          print("LOCAL_EVIDENCE_CANARY_CONFIDENCE_HIGH=10")
          print("LOCAL_EVIDENCE_CANARY_PROVENANCE_GATE=PASS")
          PY

      - name: Rebuild runtime lesson bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Validate generated lessons and remaining rewrite inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py
          python tools/audit_explanation_readiness_r1.py --limit 0 \
            | tee "$RUNNER_TEMP/explanation-readiness-after.txt"
          python tools/plan_source_backed_explanation_r1.py --limit 0 \
            | tee "$RUNNER_TEMP/source-backed-plan-after.txt"

          grep -F 'REWRITE_REMAINING_COUNT=68' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_READY_COUNT=0' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_REQUIRED_COUNT=68' "$RUNNER_TEMP/source-backed-plan-after.txt"
          grep -F 'SOURCE_BACKED_EXPLANATION_PLAN_R1=PASS' "$RUNNER_TEMP/source-backed-plan-after.txt"

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-local-evidence-canary-r1.jsonl"
          rows = [
              json.loads(line)
              for line in result_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          allowed = {
              "data/runtime/lesson_bundle_v400_5.json",
              "data_i18n/en/runtime/lesson_bundle_v400_5.json",
          }
          for row in rows:
              filename = str(row["file"])
              allowed.add(f"data/lessons/{filename}")
              allowed.add(f"data_i18n/en/lessons/{filename}")

          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected changed files: {unexpected}")

          print(f"LOCAL_EVIDENCE_CANARY_CHANGED_FILE_COUNT={len(changed)}")
          print(f"LOCAL_EVIDENCE_CANARY_ALLOWED_FILE_COUNT={len(allowed)}")
          print("LESSON_EXPLANATION_LOCAL_EVIDENCE_CANARY_R1_DIFF_BOUNDARY=PASS")
          PY

          git diff --quiet -- \
            data/runtime/support_bundle_v400_5.json \
            data_i18n/en/runtime/support_bundle_v400_5.json
          git diff --check

      - name: Commit and push reviewed local-evidence canary branch
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/lessons \
            data_i18n/en/lessons \
            data/runtime/lesson_bundle_v400_5.json \
            data_i18n/en/runtime/lesson_bundle_v400_5.json

          if git diff --cached --quiet; then
            echo "No local-evidence canary changes to commit."
            exit 1
          fi

          git commit -m "Generate 10-card local-evidence lesson explanation canary R1"
          git push -u origin "$CANARY_BRANCH"
          echo "LOCAL_EVIDENCE_CANARY_BRANCH_READY=$CANARY_BRANCH"

      - name: Upload local-evidence canary provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lesson-explanation-local-evidence-canary-r1
          path: |
            ${{ runner.temp }}/lesson-explanation-local-evidence-canary-r1.jsonl
            ${{ runner.temp }}/lesson-explanation-local-evidence-canary-r1-holds.jsonl
            ${{ runner.temp }}/explanation-readiness-after.txt
            ${{ runner.temp }}/source-backed-plan-after.txt
          if-no-files-found: warn
          retention-days: 14
