name: One-time lesson choice repair

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-lesson-choice-data-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair duplicate and blank lesson choices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          EMPTY_LABEL = '빈 문자열 ""'

          duplicate_repairs = {
              'PY3_L03_strip_001': {
                  'path': 'data/lessons/python_broad_expansion_v3.json',
                  'expected': ['lidar', '', 'LiDAR', 'LiDAR'],
                  'new': ['lidar', EMPTY_LABEL, 'LiDAR', '원본 문자열(양끝 공백 포함)'],
              },
              'PYF94_A1_L01_INPUT_007': {
                  'path': 'data/lessons/python_foundation_beginner_v94_a1_part2.json',
                  'expected': ['"  hi  "', '"hi"', '"hi"', 'None'],
                  'new': ['"  hi  "', '"hi"', EMPTY_LABEL, 'None'],
              },
              'PYF94_A2_L02_STR_010': {
                  'path': 'data/lessons/python_foundation_level2_v94_a2_part2.json',
                  'expected': ['YES', 'yes', 'YES', 'Yes'],
                  'new': ['YES', 'yes', '원본 문자열 " YES "', 'Yes'],
              },
              'PYF95_A1_FUNC_015_STRING_METHOD_RETURN': {
                  'path': 'data/lessons/python_foundation_level3_v95_a1_functions.json',
                  'expected': ['Hi', 'Hi', 'hi', 'HI'],
                  'new': ['원본 문자열 " Hi "', 'Hi', 'hi', 'HI'],
              },
              'PYF95_A1_FUNC_028_FUNCTION_NAME_MEANING': {
                  'path': 'data/lessons/python_foundation_level3_v95_a1_functions.json',
                  'expected': ['yes', 'YES', 'YES', 'None'],
                  'new': ['yes', 'YES', '원본 문자열 " YES "', 'None'],
              },
          }

          blank_repairs = {
              'PY16_L08_metadata_normalize_001': 'data/lessons/python_rag_kg_pipeline_review_v16.json',
              'PY30_L08_guard_clause_001': 'data/lessons/python_function_design_io_v30.json',
              'PY51_L06_install_prompt_001': 'data/lessons/python_pwa_install_update_ux_v51.json',
              'PY51_L08_offline_notice_001': 'data/lessons/python_pwa_install_update_ux_v51.json',
              'PY51_L08_online_recovered_notice_001': 'data/lessons/python_pwa_install_update_ux_v51.json',
              'PY52_L07_screen_reader_text_001': 'data/lessons/python_accessibility_a11y_ui_v52.json',
              'PY57_L09_license_unknown_001': 'data/lessons/python_data_governance_copyright_v57.json',
              'PY62_L08_fallback_locale_001': 'data/lessons/python_i18n_locale_language_toggle_v62.json',
              'PY124_L06_REGEX_SAFE_FLOW_001': 'data/lessons/python_regex_beginner_v124_a1.json',
          }

          def card_span(text, card_id):
              marker = re.search(r'"id"\s*:\s*' + re.escape(json.dumps(card_id, ensure_ascii=False)), text)
              if not marker:
                  raise AssertionError(f'card id not found: {card_id}')
              start = text.rfind('{', 0, marker.start())
              if start < 0:
                  raise AssertionError(f'card start not found: {card_id}')
              depth = 0
              in_string = False
              escaped = False
              for i in range(start, len(text)):
                  ch = text[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise AssertionError(f'card end not found: {card_id}')

          def choices_span(segment):
              marker = re.search(r'"choices"\s*:', segment)
              if not marker:
                  raise AssertionError('choices field not found')
              start = segment.find('[', marker.end())
              if start < 0:
                  raise AssertionError('choices array start not found')
              depth = 0
              in_string = False
              escaped = False
              for i in range(start, len(segment)):
                  ch = segment[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '[':
                      depth += 1
                  elif ch == ']':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise AssertionError('choices array end not found')

          def render_array(segment, array_start, values):
              line_start = segment.rfind('\n', 0, array_start) + 1
              key_line = segment[line_start:array_start]
              indent_match = re.match(r'([ \t]*)', key_line)
              indent = indent_match.group(1) if indent_match else ''
              item_indent = indent + '  '
              rows = [item_indent + json.dumps(value, ensure_ascii=False) for value in values]
              return '[\n' + ',\n'.join(rows) + '\n' + indent + ']'

          def replace_top_level_answer(segment, expected, new_value):
              marker = re.search(r'"answer"\s*:', segment)
              if not marker:
                  raise AssertionError('answer field not found')
              pos = marker.end()
              while pos < len(segment) and segment[pos].isspace():
                  pos += 1
              old_value, consumed = json.JSONDecoder().raw_decode(segment[pos:])
              if old_value != expected:
                  raise AssertionError(f'answer preimage mismatch: {old_value!r} != {expected!r}')
              replacement = json.dumps(new_value, ensure_ascii=False)
              return segment[:pos] + replacement + segment[pos + consumed:]

          def update_card_choices(path_str, card_id, expected_choices, new_choices, update_blank_answer=False):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8-sig')
              start, end = card_span(text, card_id)
              segment = text[start:end]
              card = json.loads(segment)
              if card.get('choices') != expected_choices:
                  raise AssertionError(f'{card_id} choices preimage mismatch: {card.get("choices")!r}')
              a, b = choices_span(segment)
              segment = segment[:a] + render_array(segment, a, new_choices) + segment[b:]
              if update_blank_answer:
                  segment = replace_top_level_answer(segment, '', EMPTY_LABEL)
              json.loads(segment)
              path.write_text(text[:start] + segment + text[end:], encoding='utf-8')

          for card_id, spec in duplicate_repairs.items():
              update_card_choices(spec['path'], card_id, spec['expected'], spec['new'])

          for card_id, path_str in blank_repairs.items():
              path = Path(path_str)
              text = path.read_text(encoding='utf-8-sig')
              start, end = card_span(text, card_id)
              segment = text[start:end]
              card = json.loads(segment)
              choices = card.get('choices')
              if not isinstance(choices, list) or choices.count('') != 1:
                  raise AssertionError(f'{card_id} expected exactly one blank choice: {choices!r}')
              new_choices = [EMPTY_LABEL if value == '' else value for value in choices]
              update_card_choices(
                  path_str,
                  card_id,
                  choices,
                  new_choices,
                  update_blank_answer=(card.get('answer') == ''),
              )

          # PY3_L03_strip_001 also had an explanation that called the correct value LiDAR an incorrect choice.
          py3_path = Path('data/lessons/python_broad_expansion_v3.json')
          text = py3_path.read_text(encoding='utf-8')
          start, end = card_span(text, 'PY3_L03_strip_001')
          segment = text[start:end]
          old_sentence = '헷갈리기 쉬운 오답: LiDAR 그 값은 strip 호출 전 원본입니다. 호출 결과에서는 양끝 공백이 제거됩니다.'
          new_sentence = '헷갈리기 쉬운 오답: 원본 문자열(양끝 공백 포함) strip()은 양끝 공백을 제거한 새 문자열을 반환합니다.'
          if old_sentence not in segment:
              raise AssertionError('PY3 explanation preimage not found')
          segment = segment.replace(old_sentence, new_sentence, 1)
          old_choice = '"choice": "LiDAR"'
          new_choice = '"choice": "원본 문자열(양끝 공백 포함)"'
          if old_choice not in segment:
              raise AssertionError('PY3 common_wrong_choice preimage not found')
          segment = segment.replace(old_choice, new_choice, 1)
          old_why = '"why_wrong": "그 값은 strip 호출 전 원본입니다. 호출 결과에서는 양끝 공백이 제거됩니다."'
          new_why = '"why_wrong": "strip() 호출 전 raw에는 양끝 공백이 있지만, 호출 결과에서는 그 공백이 제거됩니다."'
          if old_why not in segment:
              raise AssertionError('PY3 why_wrong preimage not found')
          segment = segment.replace(old_why, new_why, 1)
          json.loads(segment)
          py3_path.write_text(text[:start] + segment + text[end:], encoding='utf-8')

          # Final exact semantic checks for the five duplicate cases.
          expected_final = {
              'PY3_L03_strip_001': ['lidar', EMPTY_LABEL, 'LiDAR', '원본 문자열(양끝 공백 포함)'],
              'PYF94_A1_L01_INPUT_007': ['"  hi  "', '"hi"', EMPTY_LABEL, 'None'],
              'PYF94_A2_L02_STR_010': ['YES', 'yes', '원본 문자열 " YES "', 'Yes'],
              'PYF95_A1_FUNC_015_STRING_METHOD_RETURN': ['원본 문자열 " Hi "', 'Hi', 'hi', 'HI'],
              'PYF95_A1_FUNC_028_FUNCTION_NAME_MEANING': ['yes', 'YES', '원본 문자열 " YES "', 'None'],
          }
          path_by_id = {k: v['path'] for k, v in duplicate_repairs.items()}
          for card_id, expected in expected_final.items():
              data = json.loads(Path(path_by_id[card_id]).read_text(encoding='utf-8-sig'))
              card = next(row for row in data if row.get('id') == card_id)
              if card['choices'] != expected:
                  raise AssertionError(f'{card_id} final choices mismatch: {card["choices"]!r}')
              if len(card['choices']) != len(set(card['choices'])):
                  raise AssertionError(f'{card_id} still has duplicate choices')

          for card_id, path_str in blank_repairs.items():
              data = json.loads(Path(path_str).read_text(encoding='utf-8-sig'))
              card = next(row for row in data if row.get('id') == card_id)
              if any(not str(value).strip() for value in card['choices']):
                  raise AssertionError(f'{card_id} still has blank choices')
              if card_id == 'PY30_L08_guard_clause_001' and card.get('answer') != EMPTY_LABEL:
                  raise AssertionError('guard clause visible empty-string answer was not updated')
          PY

      - name: Run full lesson validation
        run: python tools/validate_lessons.py --expected-lesson-cards 1785

      - name: Check diff scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            data/lessons/python_accessibility_a11y_ui_v52.json \
            data/lessons/python_broad_expansion_v3.json \
            data/lessons/python_data_governance_copyright_v57.json \
            data/lessons/python_foundation_beginner_v94_a1_part2.json \
            data/lessons/python_foundation_level2_v94_a2_part2.json \
            data/lessons/python_foundation_level3_v95_a1_functions.json \
            data/lessons/python_function_design_io_v30.json \
            data/lessons/python_i18n_locale_language_toggle_v62.json \
            data/lessons/python_pwa_install_update_ux_v51.json \
            data/lessons/python_rag_kg_pipeline_review_v16.json \
            data/lessons/python_regex_beginner_v124_a1.json | sort)"
          test "$changed" = "$expected"
          git diff --stat

      - name: Commit repaired lesson data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lessons/
          git commit -m "Fix duplicate and blank lesson choices"
          git push origin HEAD:main
