name: Same Grammar Example Audit V400

on:
  push:
    branches:
      - audit/same-grammar-example-v400
    paths:
      - 'tools/audit_same_grammar_examples_v400.py'
      - 'tools/audit_effective_same_syntax_v400.js'
      - '.github/workflows/same-grammar-example-audit-v400.yml'
      - 'src/pwa/**'
      - 'data/lessons/**'
      - 'data_i18n/en/lessons/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare evidence directory
        run: mkdir -p audit_evidence
      - name: Exhaustive stored teaching-example audit
        run: python tools/audit_same_grammar_examples_v400.py | tee audit_evidence/stored_teaching_example_audit.txt
      - name: Effective runtime same-syntax audit
        run: node tools/audit_effective_same_syntax_v400.js | tee audit_evidence/effective_runtime_same_syntax_audit.txt
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: same-grammar-example-audit-v400-evidence
          path: audit_evidence/
          if-no-files-found: error
