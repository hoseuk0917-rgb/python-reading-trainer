name: Lesson explanation safe HOLD retry R1

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/lesson-explanation-api-safe-hold-retry-r1.yml'
      - 'tools/run_lesson_explanation_api_pilot_r1.py'
      - 'docs/LESSON_EXPLANATION_CONTRACT_V1.md'
      - 'tools/audit_explanation_readiness_r1.py'
  workflow_dispatch:
    inputs:
      live:
        description: 'Retry the 8 remaining safe-authority HOLD cards'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: lesson-explanation-api-safe-hold-retry-r1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile runner
        run: python -m py_compile tools/run_lesson_explanation_api_pilot_r1.py

      - name: Runner self-test
        run: python tools/run_lesson_explanation_api_pilot_r1.py --self-test

      - name: Deterministic remaining-8 plan
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_lesson_explanation_api_pilot_r1.py --plan --limit 8 \
            | tee "$RUNNER_TEMP/lesson-explanation-safe-hold-retry-r1-plan.txt"

          grep -F 'PILOT_LIMIT=8' "$RUNNER_TEMP/lesson-explanation-safe-hold-retry-r1-plan.txt"
          grep -F 'PILOT_DISPOSITION_COUNTS={"CONCEPT_EXPLANATION_REWRITE": 4, "WALKTHROUGH_OR_ANSWER_REWRITE": 4}' \
            "$RUNNER_TEMP/lesson-explanation-safe-hold-retry-r1-plan.txt"
          grep -F 'PILOT_AUTHORITY_COUNTS={"LOCAL_CODE_AUTHORITY": 3, "PYTHON_LANGUAGE_AUTHORITY": 5}' \
            "$RUNNER_TEMP/lesson-explanation-safe-hold-retry-r1-plan.txt"
          grep -F 'PILOT_SELECTION_SHA256=66457084d2af10185ce8b283c45b3995dccc0d4be2ea36e592bdf13845984315' \
            "$RUNNER_TEMP/lesson-explanation-safe-hold-retry-r1-plan.txt"

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RETRY_BRANCH: automation/lesson-explanation-safe-hold-retry-r1

    steps:
      - name: Check out full repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Require API key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Prepare clean retry branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$RETRY_BRANCH" >/dev/null 2>&1; then
            echo "Retry branch already exists: $RETRY_BRANCH"
            exit 1
          fi

          git checkout -b "$RETRY_BRANCH" origin/main

      - name: Run 8-card safe HOLD retry
        shell: bash
        run: |
          set -euo pipefail

          python tools/run_lesson_explanation_api_pilot_r1.py \
            --live \
            --limit 8 \
            --model gpt-6.1-sol \
            --result-path "$RUNNER_TEMP/lesson-explanation-safe-hold-retry-r1.jsonl" \
            --hold-path "$RUNNER_TEMP/lesson-explanation-safe-hold-retry-r1-holds.jsonl" \
            --max-total-tokens 300000 \
            --max-holds 8

      - name: Rebuild runtime lesson bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Validate generated lessons
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py
          python tools/audit_explanation_readiness_r1.py --limit 0 \
            | tee "$RUNNER_TEMP/explanation-readiness-after.txt"

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-safe-hold-retry-r1.jsonl"
          rows = [
              json.loads(line)
              for line in result_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          if not rows:
              raise SystemExit("safe HOLD retry result artifact is empty")

          allowed = {
              "data/runtime/lesson_bundle_v400_5.json",
              "data_i18n/en/runtime/lesson_bundle_v400_5.json",
          }
          for row in rows:
              filename = row["file"]
              allowed.add(f"data/lessons/{filename}")
              allowed.add(f"data_i18n/en/lessons/{filename}")

          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected changed files: {unexpected}")

          print(f"SAFE_HOLD_RETRY_CHANGED_FILE_COUNT={len(changed)}")
          print(f"SAFE_HOLD_RETRY_RESULT_ROW_COUNT={len(rows)}")
          print("LESSON_EXPLANATION_SAFE_HOLD_RETRY_R1_DIFF_BOUNDARY=PASS")
          PY

          git diff --quiet -- \
            data/runtime/support_bundle_v400_5.json \
            data_i18n/en/runtime/support_bundle_v400_5.json

          git diff --check

      - name: Commit and push retry candidate branch
        shell: bash
        run: |
          set -euo pipefail

          git add \
            data/lessons \
            data_i18n/en/lessons \
            data/runtime/lesson_bundle_v400_5.json \
            data_i18n/en/runtime/lesson_bundle_v400_5.json

          if git diff --cached --quiet; then
            echo "No safe HOLD retry changes to commit."
            exit 1
          fi

          git commit -m "Retry remaining safe lesson explanation HOLD cards R1"
          git push -u origin "$RETRY_BRANCH"

          echo "SAFE_HOLD_RETRY_BRANCH_READY=$RETRY_BRANCH"

      - name: Upload retry provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lesson-explanation-safe-hold-retry-r1
          path: |
            ${{ runner.temp }}/lesson-explanation-safe-hold-retry-r1.jsonl
            ${{ runner.temp }}/lesson-explanation-safe-hold-retry-r1-holds.jsonl
            ${{ runner.temp }}/explanation-readiness-after.txt
          if-no-files-found: warn
          retention-days: 14
