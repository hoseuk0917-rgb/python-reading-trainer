name: Learning experience V341 gate

on:
  push:
    branches:
      - feat/learning-experience-v341

permissions:
  contents: write

jobs:
  learning-experience-v341:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout V341 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/learning-experience-v341

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply side-card education repair
        run: python tools/repair_sidecard_educational_quality_v341.py --apply

      - name: Confirm side-card repair idempotence
        run: python tools/repair_sidecard_educational_quality_v341.py --check

      - name: Apply V341 PWA integration
        run: python tools/apply_learning_experience_v341.py --apply

      - name: Confirm V341 PWA integration idempotence
        run: python tools/apply_learning_experience_v341.py --check

      - name: Apply exact practice mission mapping
        run: python tools/apply_learning_experience_v341_r2.py --apply

      - name: Confirm exact mission mapping idempotence
        run: python tools/apply_learning_experience_v341_r2.py --check

      - name: Apply V340-path readiness guard
        run: python tools/apply_learning_experience_v341_r3.py --apply

      - name: Confirm readiness guard idempotence
        run: python tools/apply_learning_experience_v341_r3.py --check

      - name: Apply internal delegated mission routing
        run: python tools/apply_learning_experience_v341_r4.py --apply

      - name: Confirm delegated routing idempotence
        run: python tools/apply_learning_experience_v341_r4.py --check

      - name: Apply reset postprocess
        run: python tools/apply_learning_experience_v341_r5.py --apply

      - name: Confirm reset postprocess idempotence
        run: python tools/apply_learning_experience_v341_r5.py --check

      - name: Remove runtime diagnostics for release
        run: python tools/apply_learning_experience_v341_release_cleanup.py --apply

      - name: Confirm release cleanup idempotence
        run: python tools/apply_learning_experience_v341_release_cleanup.py --check

      - name: Make real-browser smoke release-strict
        run: python tools/apply_learning_experience_v341_smoke_release.py --apply

      - name: Confirm release smoke idempotence
        run: python tools/apply_learning_experience_v341_smoke_release.py --check

      - name: JavaScript syntax
        run: |
          node --check src/pwa/learning_engine_v341.js
          node --check src/pwa/learning_experience_v341.js
          node --check tools/audit_learning_experience_v341.js
          node --check tools/audit_learning_experience_v341_r2.js
          node --check tools/run_learning_experience_v341_browser_smoke.js

      - name: V341 pure engine audit
        run: node tools/audit_learning_experience_v341.js

      - name: V341 exact mission routing audit
        run: node tools/audit_learning_experience_v341_r2.js

      - name: Assert release code has no diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '__v341MissionTrace|__v341ResetTrace|openPracticeMissionV341|LEARNING_EXPERIENCE_V341_R6_RUNTIME_TRACE' src/pwa/learning_experience_v341.js; then
            echo "V341_RELEASE_DIAGNOSTICS_ABSENT=FAIL"
            exit 1
          fi
          if grep -Eq 'MISSION_DIRECT_|MISSION_TRACE=|RESET_TRACE=|openPracticeMissionV341|__v341MissionTrace|__v341ResetTrace' tools/learning_experience_v341_browser_case.html; then
            echo "V341_RELEASE_SMOKE_DIAGNOSTICS_ABSENT=FAIL"
            exit 1
          fi
          echo "V341_RELEASE_DIAGNOSTICS_ABSENT=PASS"
          echo "V341_RELEASE_SMOKE_DIAGNOSTICS_ABSENT=PASS"

      - name: Side-card educational quality audit
        run: python tools/audit_sidecard_educational_quality_v341.py

      - name: Existing V340 learning regression
        run: node tools/audit_learning_loop_v340.js

      - name: Existing lesson validation
        run: python tools/validate_lessons.py

      - name: Existing V339 content quality gates
        run: |
          python tools/content_quality_final_pass_v339.py --check
          python tools/content_quality_final_pass_v339_r2.py --check
          python tools/content_quality_final_pass_v339_r4.py --check
          node tools/audit_content_semantic_alignment_v339_r4.js

      - name: Patch integrity
        run: git diff --check

      - name: Real-browser V341 release smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v341-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:3377/tools/learning_experience_v341_browser_case.html > /dev/null
          node tools/run_learning_experience_v341_browser_smoke.js

      - name: Commit release-clean integration if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "V341_INTEGRATION_ALREADY_CLEAN=True"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pwa/index.html src/pwa/learning_engine_v341.js src/pwa/learning_experience_v341.js tools/learning_experience_v341_browser_case.html data/side_cards data_i18n/en/side_cards
          git commit -m "Remove V341 diagnostics and finalize release behavior"
          git push origin HEAD:feat/learning-experience-v341
          echo "V341_RELEASE_CLEAN_COMMIT_PUSHED=True"
