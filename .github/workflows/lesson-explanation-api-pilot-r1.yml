name: Lesson explanation API pilot R1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/run_lesson_explanation_api_pilot_r1.py'
      - '.github/workflows/lesson-explanation-api-pilot-r1.yml'
      - 'docs/LESSON_EXPLANATION_CONTRACT_V1.md'
      - 'tools/audit_explanation_readiness_r1.py'
  push:
    branches: [ main ]
    paths:
      - 'tools/run_lesson_explanation_api_pilot_r1.py'
      - '.github/workflows/lesson-explanation-api-pilot-r1.yml'
      - 'docs/LESSON_EXPLANATION_CONTRACT_V1.md'
      - 'tools/audit_explanation_readiness_r1.py'
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the real 100-card OpenAI API pilot'
        required: false
        default: false
        type: boolean
      limit:
        description: 'Pilot card count; maximum 100'
        required: false
        default: '100'
        type: string

permissions:
  contents: write

concurrency:
  group: lesson-explanation-api-pilot-r1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile pilot runner
        run: python -m py_compile tools/run_lesson_explanation_api_pilot_r1.py

      - name: Pilot runner self-test
        run: python tools/run_lesson_explanation_api_pilot_r1.py --self-test

      - name: Deterministic 100-card plan
        run: python tools/run_lesson_explanation_api_pilot_r1.py --plan --limit 100

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    needs: validate
    runs-on: ubuntu-24.04

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PILOT_BRANCH: automation/lesson-explanation-api-pilot-r1

    steps:
      - name: Check out full repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Require API key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Prepare clean pilot branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          if git ls-remote --exit-code --heads origin "$PILOT_BRANCH" >/dev/null 2>&1; then
            echo "Pilot branch already exists: $PILOT_BRANCH"
            echo "Refusing to silently process a second batch."
            exit 1
          fi

          git checkout -b "$PILOT_BRANCH" origin/main

      - name: Run real lesson explanation pilot
        shell: bash
        run: |
          set -euo pipefail

          LIMIT="${{ inputs.limit }}"
          if ! [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "limit must be a positive integer: $LIMIT"
            exit 1
          fi
          if [ "$LIMIT" -gt 100 ]; then
            echo "pilot limit may not exceed 100"
            exit 1
          fi

          python tools/run_lesson_explanation_api_pilot_r1.py             --live             --limit "$LIMIT"             --model gpt-6.1-sol             --result-path "$RUNNER_TEMP/lesson-explanation-api-pilot-r1.jsonl"             --max-total-tokens 1500000

      - name: Rebuild runtime lesson bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Validate generated lessons
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py
          python tools/audit_explanation_readiness_r1.py --limit 0             | tee "$RUNNER_TEMP/explanation-readiness-after.txt"

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-api-pilot-r1.jsonl"
          rows = [
              json.loads(line)
              for line in result_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          if not rows:
              raise SystemExit("pilot result artifact is empty")

          allowed = {
              "data/runtime/lesson_bundle_v400_5.json",
              "data_i18n/en/runtime/lesson_bundle_v400_5.json",
          }
          for row in rows:
              filename = row["file"]
              allowed.add(f"data/lessons/{filename}")
              allowed.add(f"data_i18n/en/lessons/{filename}")

          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          unexpected = sorted(changed - allowed)
          missing_runtime = sorted(
              {
                  "data/runtime/lesson_bundle_v400_5.json",
                  "data_i18n/en/runtime/lesson_bundle_v400_5.json",
              }
              - changed
          )

          if unexpected:
              raise SystemExit(f"unexpected changed files: {unexpected}")
          if missing_runtime:
              raise SystemExit(f"runtime lesson bundle changes missing: {missing_runtime}")

          print(f"PILOT_CHANGED_FILE_COUNT={len(changed)}")
          print(f"PILOT_RESULT_ROW_COUNT={len(rows)}")
          print("LESSON_EXPLANATION_API_PILOT_R1_DIFF_BOUNDARY=PASS")
          PY

          git diff --quiet --             data/runtime/support_bundle_v400_5.json             data_i18n/en/runtime/support_bundle_v400_5.json

          git diff --check

      - name: Commit and push reviewed pilot candidate branch
        shell: bash
        run: |
          set -euo pipefail

          git add             data/lessons             data_i18n/en/lessons             data/runtime/lesson_bundle_v400_5.json             data_i18n/en/runtime/lesson_bundle_v400_5.json

          if git diff --cached --quiet; then
            echo "No pilot changes to commit."
            exit 1
          fi

          git commit -m "Generate 100-card lesson explanation API pilot R1"
          git push -u origin "$PILOT_BRANCH"

          echo "PILOT_BRANCH_READY=$PILOT_BRANCH"

      - name: Upload pilot provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lesson-explanation-api-pilot-r1
          path: |
            ${{ runner.temp }}/lesson-explanation-api-pilot-r1.jsonl
            ${{ runner.temp }}/explanation-readiness-after.txt
          if-no-files-found: warn
          retention-days: 14
