name: Temporary last safe card runtime sync

on:
  push:
    branches:
      - fix/lesson-explanation-last-safe-card-r1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build runtime lesson bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Validate lessons and final safe card
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("tools").resolve()))
          import audit_explanation_readiness_r1 as readiness

          target = "PY58_L10_card_authoring_pipeline_001"
          cards = {str(card["id"]): card for card in readiness.load_cards()}
          card = cards[target]
          reasons = set(readiness.quality_reasons(card))
          blocked = {
              reason for reason in reasons
              if reason in {
                  "MISSING_TEACHING_EXAMPLE",
                  "WALKTHROUGH_THIN",
                  "ANSWER_TRACE_THIN",
                  "WHY_CORRECT_THIN",
                  "WRONG_CHOICE_REASONING_THIN",
                  "TAKEAWAY_THIN",
              } or reason.startswith("TEACHING_EXAMPLE_")
          }
          print("FINAL_SAFE_CARD_REASONS=" + ",".join(sorted(reasons)))
          if blocked:
              raise SystemExit("FINAL_SAFE_CARD_TARGET_QUALITY=FAIL:" + ",".join(sorted(blocked)))
          print("FINAL_SAFE_CARD_TARGET_QUALITY=PASS")
          PY

      - name: Commit runtime sync and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             data/runtime/lesson_bundle_v400_5.json             data_i18n/en/runtime/lesson_bundle_v400_5.json

          git rm .github/workflows/tmp-last-safe-card-runtime-sync.yml

          git commit -m "Sync final safe lesson explanation runtime bundle"
          git push origin HEAD:fix/lesson-explanation-last-safe-card-r1
