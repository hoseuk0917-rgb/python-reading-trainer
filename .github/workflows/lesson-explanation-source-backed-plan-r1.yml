name: Lesson explanation source-backed plan R1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/plan_source_backed_explanation_r1.py'
      - 'tools/plan_source_required_resolution_r1.py'
      - 'tools/audit_explanation_readiness_r1.py'
      - 'tools/audit_source_bundle_mapping_r1.py'
      - '.github/workflows/lesson-explanation-source-backed-plan-r1.yml'

jobs:
  plan:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile source-backed plans
        run: |
          python -m py_compile tools/plan_source_backed_explanation_r1.py
          python -m py_compile tools/plan_source_required_resolution_r1.py

      - name: Plan remaining source-backed rewrites
        run: python tools/plan_source_backed_explanation_r1.py --limit 0

      - name: Plan source-required resolution inventory
        run: python tools/plan_source_required_resolution_r1.py --limit 120
