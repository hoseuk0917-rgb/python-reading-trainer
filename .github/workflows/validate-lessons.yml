name: Validate lesson data

on:
  push:
    branches: [ main ]
    paths:
      - 'src/pwa/app.js'
      - 'data/lessons/**'
      - 'data/side_cards/**'
      - 'tools/validate_lessons.py'
      - '.github/workflows/validate-lessons.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/pwa/app.js'
      - 'data/lessons/**'
      - 'data/side_cards/**'
      - 'tools/validate_lessons.py'
      - '.github/workflows/validate-lessons.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate lesson data
        run: python tools/validate_lessons.py
