name: Validate lesson data

on:
  push:
    branches: [ main ]
    paths:
      - 'src/pwa/app.js'
      - 'data/lessons/**'
      - 'data/side_cards/**'
      - 'tools/validate_lessons.py'
      - '.github/workflows/validate-lessons.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/pwa/app.js'
      - 'data/lessons/**'
      - 'data/side_cards/**'
      - 'tools/validate_lessons.py'
      - '.github/workflows/validate-lessons.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate lesson data
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/validate_lessons.py 2>&1 | tee lesson-validation.txt

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-validation-report
          path: lesson-validation.txt
          retention-days: 7

      - name: Fail when validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
