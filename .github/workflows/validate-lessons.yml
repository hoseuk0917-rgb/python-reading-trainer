# Validates structural data and learner-visible lesson choice quality.
name: Validate lesson data

on:
  push:
    branches: [ main ]
    paths:
      - 'src/pwa/app.js'
      - 'data/lessons/**'
      - 'data/side_cards/**'
      - 'tools/validate_lessons.py'
      - 'tools/audit_learning_sequence_r1.py'
      - 'tools/verify_learning_sequence_runtime_r1.py'
      - 'data/curriculum/learning_sequence_r1.json'
      - '.github/workflows/validate-lessons.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/pwa/app.js'
      - 'data/lessons/**'
      - 'data/side_cards/**'
      - 'tools/validate_lessons.py'
      - 'tools/audit_learning_sequence_r1.py'
      - 'tools/verify_learning_sequence_runtime_r1.py'
      - 'data/curriculum/learning_sequence_r1.json'
      - '.github/workflows/validate-lessons.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate lesson data
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/validate_lessons.py --explanation-readiness --explanation-readiness-limit 300 2>&1 | tee lesson-validation.txt

      - name: Audit learning sequence R1
        id: sequence
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/audit_learning_sequence_r1.py --limit 200 2>&1 | tee learning-sequence-r1.txt

      - name: Verify learning sequence runtime R1
        id: sequence_runtime
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/verify_learning_sequence_runtime_r1.py 2>&1 | tee learning-sequence-runtime-r1.txt

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-validation-report
          path: |
            lesson-validation.txt
            learning-sequence-r1.txt
            learning-sequence-runtime-r1.txt
          retention-days: 7

      - name: Fail when validation failed
        if: steps.validate.outcome == 'failure' || steps.sequence.outcome == 'failure' || steps.sequence_runtime.outcome == 'failure'
        run: exit 1
