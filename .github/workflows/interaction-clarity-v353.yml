name: interaction-clarity-v353

on:
  push:
    branches:
      - agent/v353-interaction-clarity
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: interaction-clarity-v353-branch
  cancel-in-progress: true

jobs:
  v353-interaction-clarity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V353 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/v353-interaction-clarity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply V353 integration and browser compatibility
        run: |
          python tools/apply_interaction_clarity_v353.py --apply
          python tools/apply_v353_v345_browser_compat.py --apply
          python tools/apply_v353_v349_browser_compat.py --apply

      - name: Confirm V353 integration idempotence
        run: |
          python tools/apply_interaction_clarity_v353.py --check
          python tools/apply_v353_v345_browser_compat.py --check
          python tools/apply_v353_v349_browser_compat.py --check

      - name: Syntax checks
        run: |
          python -m py_compile tools/apply_interaction_clarity_v353.py tools/apply_v353_v345_browser_compat.py tools/apply_v353_v349_browser_compat.py
          node --check src/pwa/interaction_clarity_v353.js
          node --check tools/audit_interaction_clarity_v353.js
          node --check tools/interaction_clarity_v353_browser_case.js
          node --check tools/run_interaction_clarity_v353_browser_smoke.js
          node --check tools/study_experience_v345_browser_case.js
          node --check tools/consumer_ux_v349_browser_case.js

      - name: V353 interaction clarity audit
        run: node tools/audit_interaction_clarity_v353.js

      - name: Existing lesson validation
        run: python tools/validate_lessons.py

      - name: Existing learning UX architecture gates
        run: |
          node tools/audit_study_experience_v345.js
          node tools/audit_study_quality_v346.js
          node tools/audit_learning_runtime_v348.js
          node tools/audit_consumer_ux_v349.js
          node tools/audit_learning_flow_v350.js
          node tools/audit_contextual_practice_v351.js
          node tools/audit_worked_example_dedup_v352.js

      - name: Diff integrity
        run: git diff --check

      - name: Real browser regressions and V353 smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v353-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then break; fi
            sleep 0.1
          done
          node tools/run_study_experience_v345_browser_smoke.js
          node tools/run_consumer_ux_v349_browser_smoke.js
          node tools/run_interaction_clarity_v353_browser_smoke.js

      - name: Commit V353 generated integration if needed
        if: success()
        run: |
          if git diff --quiet; then
            echo "V353_ALREADY_CLEAN=True"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pwa/index.html tools/study_experience_v345_browser_case.js tools/consumer_ux_v349_browser_case.js
          git commit -m "Integrate V353 interaction clarity UX"
          git push origin HEAD:agent/v353-interaction-clarity
          echo "V353_CHANGES_PUSHED=True"
