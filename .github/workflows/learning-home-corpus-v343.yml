name: learning-home-corpus-v343

on:
  push:
    branches:
      - feat/home-and-corpus-review-v343
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v343-home-corpus:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V343 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/home-and-corpus-review-v343

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wire V343 learning home
        run: python tools/apply_learning_home_v343.py --apply

      - name: Confirm home wiring idempotence
        run: python tools/apply_learning_home_v343.py --check

      - name: Apply V343 learning layout hardening
        run: python tools/apply_learning_home_layout_v343.py --apply

      - name: Confirm layout hardening idempotence
        run: python tools/apply_learning_home_layout_v343.py --check

      - name: Apply V343 R2 contextual corpus repairs
        run: python tools/repair_corpus_context_v343_r2.py --apply

      - name: Confirm V343 R2 repair idempotence
        run: python tools/repair_corpus_context_v343_r2.py --check

      - name: Apply V343 R3 educational corpus cleanup
        run: python tools/repair_corpus_context_v343_r3.py --apply

      - name: Confirm V343 R3 repair idempotence
        run: python tools/repair_corpus_context_v343_r3.py --check

      - name: Apply V343 R4 residual readability cleanup
        run: python tools/repair_corpus_context_v343_r4.py --apply

      - name: Confirm V343 R4 repair idempotence
        run: python tools/repair_corpus_context_v343_r4.py --check

      - name: Apply conservative corpus context cleanup
        run: python tools/content_context_review_v343.py --apply

      - name: Confirm corpus context cleanup idempotence
        run: python tools/content_context_review_v343.py --check

      - name: JavaScript syntax
        run: |
          node --check src/pwa/learning_home_v343.js
          node --check tools/run_learning_home_v343_browser_smoke.js
          node --check src/pwa/learning_engine_v340.js
          node --check src/pwa/learning_engine_v341.js
          node --check src/pwa/learning_experience_v341.js

      - name: Existing lesson validation
        run: python tools/validate_lessons.py

      - name: Existing V339 content quality gates
        run: |
          python tools/content_quality_final_pass_v339.py --check
          python tools/content_quality_final_pass_v339_r2.py --check
          python tools/content_quality_final_pass_v339_r4.py --check
          node tools/audit_content_semantic_alignment_v339_r4.js

      - name: Existing V340 learning regression
        run: node tools/audit_learning_loop_v340.js

      - name: Existing V341 learning experience regression
        run: |
          node tools/audit_learning_experience_v341.js
          node tools/audit_learning_experience_v341_r2.js
          python tools/audit_development_workflow_sidecards_v341_a2.py
          python tools/audit_sidecard_educational_quality_v341.py

      - name: Existing V342 hardening regression
        run: node tools/audit_learning_hardening_v342_r2.js

      - name: Diff integrity
        run: git diff --check

      - name: V343 real browser home smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v343-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then
              break
            fi
            sleep 0.1
          done
          node tools/run_learning_home_v343_browser_smoke.js

      - name: Commit V343 changes if needed
        run: |
          if git diff --quiet; then
            echo "V343_ALREADY_CLEAN=True"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pwa/index.html src/pwa/learning_home_v343.js data/lessons data_i18n/en/lessons docs/quality/v343_corpus_context_review.md
          git commit -m "Apply V343 home and corpus quality pass"
          git push origin HEAD:feat/home-and-corpus-review-v343
          echo "V343_CHANGES_PUSHED=True"