name: worked-example-dedup-v352

on:
  push:
    branches:
      - agent/v352-worked-example-dedup-audit
    paths:
      - 'src/pwa/app.js'
      - 'src/pwa/learning_engine_v340.js'
      - 'data/lessons/**'
      - 'data_i18n/en/lessons/**'
      - 'tools/audit_worked_example_dedup_v352.js'
      - '.github/workflows/worked-example-dedup-v352.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5
      - name: Node syntax
        run: node --check tools/audit_worked_example_dedup_v352.js
      - name: Full KO EN worked-example audit
        run: node tools/audit_worked_example_dedup_v352.js
