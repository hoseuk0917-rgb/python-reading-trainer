name: study-quality-v346

on:
  push:
    branches:
      - feat/progress-terminology-ui-v346
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v346-study-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V346 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/progress-terminology-ui-v346

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply V346 integration
        run: python tools/apply_study_quality_v346.py --apply

      - name: Confirm V346 integration idempotence
        run: python tools/apply_study_quality_v346.py --check

      - name: Apply V346 canonical review action
        run: python tools/apply_study_quality_v346_r2.py --apply

      - name: Confirm V346 review action idempotence
        run: python tools/apply_study_quality_v346_r2.py --check

      - name: Apply V346 future terminology repair
        run: python tools/repair_future_terminology_v346.py --apply

      - name: Confirm V346 terminology repair idempotence
        run: python tools/repair_future_terminology_v346.py --check

      - name: V346 syntax checks
        run: |
          node --check src/pwa/study_progress_v346.js
          node --check tools/audit_study_quality_v346.js
          node --check tools/study_quality_v346_browser_case.js
          node --check tools/run_study_quality_v346_browser_smoke.js
          python -m py_compile tools/apply_study_quality_v346.py tools/apply_study_quality_v346_r2.py tools/audit_terminology_guard_v346.py tools/repair_future_terminology_v346.py

      - name: V346 study quality contract audit
        run: node tools/audit_study_quality_v346.js

      - name: V346 corpus terminology leakage gate
        run: python tools/audit_terminology_guard_v346.py

      - name: Existing lesson validation
        run: python tools/validate_lessons.py

      - name: Existing V339 content quality gates
        run: |
          python tools/content_quality_final_pass_v339.py --check
          python tools/content_quality_final_pass_v339_r2.py --check
          python tools/content_quality_final_pass_v339_r4.py --check
          node tools/audit_content_semantic_alignment_v339_r4.js

      - name: Existing V340 learning regression
        run: node tools/audit_learning_loop_v340.js

      - name: Existing V341 learning experience regression
        run: |
          node tools/audit_learning_experience_v341.js
          node tools/audit_learning_experience_v341_r2.js
          python tools/audit_development_workflow_sidecards_v341_a2.py
          python tools/audit_sidecard_educational_quality_v341.py

      - name: Existing V342 hardening regression
        run: node tools/audit_learning_hardening_v342_r2.js

      - name: Existing V343 corpus regression
        run: |
          python tools/content_context_review_v343.py --check
          node --check src/pwa/learning_home_v343.js

      - name: Existing V344 explanation regression
        run: |
          python tools/apply_explanation_quality_v344_r2.py --check
          python tools/apply_explanation_support_v344_r3.py --check
          python tools/apply_explanation_support_v344_r4.py --check
          python tools/apply_explanation_support_v344_r5.py --check
          node tools/audit_explanation_quality_v344.js
          node tools/smoke_explainer_regression_v323_a6.js
          node tools/quality_gate_explainer_v324_a1.js

      - name: Existing V345 study experience regression
        run: |
          python tools/apply_study_experience_v345.py --check
          python tools/apply_study_experience_v345_r2.py --check
          node tools/audit_study_experience_v345.js

      - name: Diff integrity
        run: git diff --check

      - name: V343 real browser home regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v343-v346-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then break; fi
            sleep 0.1
          done
          node tools/run_learning_home_v343_browser_smoke.js

      - name: V344 real browser explanation regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v344-v346-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then break; fi
            sleep 0.1
          done
          node tools/run_explanation_quality_v344_browser_smoke.js

      - name: V345 real browser study experience regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v345-v346-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then break; fi
            sleep 0.1
          done
          node tools/run_study_experience_v345_browser_smoke.js

      - name: V346 real browser next-action smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v346-http.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then break; fi
            sleep 0.1
          done
          node tools/run_study_quality_v346_browser_smoke.js

      - name: Commit V346 generated changes if needed
        run: |
          if git diff --quiet; then
            echo "V346_ALREADY_CLEAN=True"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pwa/index.html \
            src/pwa/study_progress_v346.js \
            data/lessons/cards_seed_v1.json \
            data_i18n/en/lessons/cards_seed_v1.json \
            data/lessons/python_core_expansion_v1.json \
            data_i18n/en/lessons/python_core_expansion_v1.json \
            data_i18n/en/lessons/python_broad_expansion_v3.json \
            data/lessons/python_compute_concepts_v13.json \
            data_i18n/en/lessons/python_compute_concepts_v13.json
          git commit -m "Apply V346 study quality contract"
          git push origin HEAD:feat/progress-terminology-ui-v346
          echo "V346_CHANGES_PUSHED=True"
