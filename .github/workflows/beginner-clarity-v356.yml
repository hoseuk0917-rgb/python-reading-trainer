name: beginner-clarity-v356

on:
  push:
    branches:
      - agent/v356-line-by-line-beginner-clarity
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beginner-clarity-v356-branch
  cancel-in-progress: true

jobs:
  v356-beginner-clarity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V356 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/v356-line-by-line-beginner-clarity

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Syntax check V356 tools
        run: |
          python -m py_compile tools/apply_beginner_clarity_v356.py
          python -m py_compile tools/apply_beginner_clarity_v356_batch2.py
          python -m py_compile tools/apply_beginner_clarity_v356_batch3.py
          python -m py_compile tools/apply_beginner_clarity_v356_level2_foundation.py
          python -m py_compile tools/apply_beginner_clarity_v356_level2_remaining.py
          python -m py_compile tools/apply_beginner_clarity_v356_level2_float.py
          python -m py_compile tools/apply_beginner_clarity_v356_level2_result_closure.py
          python -m py_compile tools/apply_beginner_clarity_v356_level3_functions.py
          python -m py_compile tools/apply_beginner_clarity_v356_level3_all.py
          python -m py_compile tools/audit_beginner_clarity_v356_level3.py
          python -m py_compile tools/finalize_beginner_clarity_v356_runtime.py
          python -m py_compile tools/audit_beginner_clarity_v356.py
          python -m py_compile tools/inventory_clarity_levels_v356.py
          python -m py_compile tools/export_v356_review_ledger.py

      - name: Exact V356 level inventory
        run: python tools/inventory_clarity_levels_v356.py

      - name: Export V356 full semantic review ledger
        run: python tools/export_v356_review_ledger.py

      - name: Commit V356 review ledger snapshot
        run: |
          git add docs/audit/v356_review_ledger.tsv
          if git diff --cached --quiet; then
            echo "V356_LEDGER_ALREADY_CURRENT=True"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh V356 semantic review ledger"
            git push origin HEAD:agent/v356-line-by-line-beginner-clarity
            echo "V356_LEDGER_PUSHED=True"
          fi

      - name: Apply V356 complete Level 1-3 batches
        run: |
          python tools/apply_beginner_clarity_v356.py
          python tools/apply_beginner_clarity_v356_batch2.py
          python tools/apply_beginner_clarity_v356_batch3.py
          python tools/apply_beginner_clarity_v356_level2_foundation.py
          python tools/apply_beginner_clarity_v356_level2_remaining.py
          python tools/apply_beginner_clarity_v356_level2_float.py
          python tools/apply_beginner_clarity_v356_level2_result_closure.py
          python tools/finalize_beginner_clarity_v356_runtime.py
          python tools/apply_beginner_clarity_v356_level3_functions.py
          python tools/apply_beginner_clarity_v356_level3_all.py

      - name: Confirm V356 apply idempotence
        shell: bash
        run: |
          set -euo pipefail
          git diff -- src/pwa/app.js data/lessons docs/audit/v356_level3_exact_manifest.json > /tmp/v356-before.diff
          python tools/apply_beginner_clarity_v356.py
          python tools/apply_beginner_clarity_v356_batch2.py
          python tools/apply_beginner_clarity_v356_batch3.py
          python tools/apply_beginner_clarity_v356_level2_foundation.py
          python tools/apply_beginner_clarity_v356_level2_remaining.py
          python tools/apply_beginner_clarity_v356_level2_float.py
          python tools/apply_beginner_clarity_v356_level2_result_closure.py
          python tools/finalize_beginner_clarity_v356_runtime.py
          python tools/apply_beginner_clarity_v356_level3_functions.py
          python tools/apply_beginner_clarity_v356_level3_all.py
          git diff -- src/pwa/app.js data/lessons docs/audit/v356_level3_exact_manifest.json > /tmp/v356-after.diff
          cmp /tmp/v356-before.diff /tmp/v356-after.diff
          echo "V356_IDEMPOTENCE=PASS"

      - name: JavaScript syntax after concept patch
        run: node --check src/pwa/app.js

      - name: V356 full-card inventory and Level 1-2 clarity audit
        run: python tools/audit_beginner_clarity_v356.py

      - name: V356 Level 3 exact-set clarity audit
        run: python tools/audit_beginner_clarity_v356_level3.py

      - name: Existing lesson validation
        run: python tools/validate_lessons.py

      - name: Existing V339 content quality gates
        run: |
          python tools/content_quality_final_pass_v339.py --check
          python tools/content_quality_final_pass_v339_r2.py --check
          python tools/content_quality_final_pass_v339_r4.py --check
          node tools/audit_content_semantic_alignment_v339_r4.js

      - name: Existing learning and explanation regressions
        run: |
          node tools/audit_learning_loop_v340.js
          node tools/audit_learning_experience_v341.js
          node tools/audit_learning_experience_v341_r2.js
          node tools/audit_learning_hardening_v342_r2.js
          node tools/audit_explanation_quality_v344.js
          node tools/audit_study_experience_v345.js
          node tools/audit_study_quality_v346.js
          node tools/audit_learning_runtime_v348.js
          node tools/audit_consumer_ux_v349.js
          node tools/audit_learning_flow_v350.js
          node tools/audit_contextual_practice_v351.js
          node tools/audit_worked_example_dedup_v352.js
          node tools/audit_interaction_clarity_v353.js
          node tools/audit_worked_example_quality_v355.js

      - name: Diff integrity
        run: git diff --check

      - name: Start V356 browser test server
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 3377 --bind 127.0.0.1 > /tmp/prt-v356-http.log 2>&1 &
          echo $! > /tmp/prt-v356-http.pid
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3377/src/pwa/index.html > /dev/null; then
              echo "V356_BROWSER_SERVER=READY"
              exit 0
            fi
            sleep 0.1
          done
          cat /tmp/prt-v356-http.log || true
          exit 1

      - name: Browser V355 worked example quality
        if: always()
        run: node tools/run_worked_example_quality_v355_browser_smoke.js

      - name: Browser V344 explanation quality
        if: always()
        run: node tools/run_explanation_quality_v344_browser_smoke.js

      - name: Browser V345 study experience
        if: always()
        run: node tools/run_study_experience_v345_browser_smoke.js

      - name: Browser V349 consumer UX
        if: always()
        run: node tools/run_consumer_ux_v349_browser_smoke.js

      - name: Stop V356 browser test server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/prt-v356-http.pid ]; then
            kill "$(cat /tmp/prt-v356-http.pid)" 2>/dev/null || true
          fi

      - name: Commit V356 generated review artifacts if needed
        if: success()
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "V356_ALREADY_CLEAN=True"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pwa/app.js data/lessons docs/audit/v356_level3_exact_manifest.json docs/audit/v356_review_ledger.tsv
          git commit -m "Apply V356 generated clarity changes"
          git push origin HEAD:agent/v356-line-by-line-beginner-clarity
          echo "V356_CHANGES_PUSHED=True"
