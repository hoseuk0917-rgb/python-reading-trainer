name: V400.5 finalize runtime bundle wiring

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v400-5-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply V400.5 release wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8-sig")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}: {old!r}")
              write(path, text.replace(old, new, 1))

          # PWA index: start both runtime bundles during head parsing, before app.js.
          path = "src/pwa/index.html"
          text = read(path)
          old = '  <link rel="manifest" href="./manifest.json?v=20260821_v400_1">\n</head>'
          new = (
              '  <link rel="manifest" href="./manifest.json?v=20260821_v400_5">\n'
              '  <script src="./runtime_lesson_bundle_v400_5.js?v=20260821_v400_5"></script>\n'
              '</head>'
          )
          if text.count(old) != 1:
              raise SystemExit("src/pwa/index.html: head wiring target mismatch")
          text = text.replace(old, new, 1)
          old_app = '<script src="./app.js?v=20260812_v339_quality1&cq=20260812_v339_quality3&le=20260812_v341_a2&eq=20260812_v344_explain1&we=20260813_v352_a1&v400=20260821_v400_1"></script>'
          new_app = '<script src="./app.js?v=20260812_v339_quality1&cq=20260812_v339_quality3&le=20260812_v341_a2&eq=20260812_v344_explain1&we=20260813_v352_a1&v400=20260821_v400_5"></script>'
          if text.count(old_app) != 1:
              raise SystemExit("src/pwa/index.html: app cache key target mismatch")
          text = text.replace(old_app, new_app, 1)
          old_polish = '<script src="./release_polish_v400_1.js?v=20260821_v400_1"></script>'
          new_polish = '<script src="./release_polish_v400_1.js?v=20260821_v400_5"></script>'
          if text.count(old_polish) != 1:
              raise SystemExit("src/pwa/index.html: polish cache key target mismatch")
          text = text.replace(old_polish, new_polish, 1)
          write(path, text)

          # README release notes.
          path = "README.md"
          text = read(path)
          if text.count("## 현재 릴리즈: V400.4") != 1:
              raise SystemExit("README release heading target mismatch")
          text = text.replace("## 현재 릴리즈: V400.4", "## 현재 릴리즈: V400.5", 1)
          old = """V400.4에서는 모바일 로딩 체감과 PWA 갱신 동작을 정리했습니다.\n\n- service worker 교체 시 강제 reload/navigation 제거\n- 새 service worker 설치 때 대용량 도구 파일 전체를 다시 선캐시하지 않도록 shell 최소화\n- 이전 V400 cache를 새 cache로 로컬 마이그레이션한 뒤 정리\n- 학습 JSON은 저장본을 먼저 보여주고 백그라운드에서 최신본을 갱신\n- 첫 학습 데이터가 준비되기 전 legacy `Loading...` 카드 대신 compact 로딩 카드 표시\n- 상단 KO/EN과 하단 navigation은 로딩 중에도 최종 UI를 유지\n- 공개 Pages의 Admin/Developer 진입은 계속 비활성화\n"""
          new = """V400.5에서는 실제 초기 데이터 요청 수를 줄였습니다.\n\n- 98개 lesson JSON을 KO/EN별 runtime lesson bundle 1개로 통합\n- side-card/reference/resource JSON도 KO/EN별 support bundle 1개로 통합\n- 두 runtime bundle을 `<head>`에서 동시에 시작해 `app.js` 데이터 로딩보다 먼저 다운로드\n- 기존 `app.js`의 파일별 응답 계약은 유지하고 네트워크 요청만 memory bundle 응답으로 대체\n- bundle이 없거나 검증에 실패하면 기존 개별 JSON fetch로 자동 fallback\n- lesson bundle은 KO/EN 각각 1,785장 전체를 담아 총량·정렬·진도 계약을 유지\n- V400.4의 강제 reload/navigation 제거와 compact 로더 정책을 유지\n- 공개 Pages의 Admin/Developer 진입은 계속 비활성화\n"""
          if old not in text:
              raise SystemExit("README V400.4 detail block target mismatch")
          text = text.replace(old, new, 1)
          text = text.replace("V400.4의 배포 정책:", "V400.5의 배포 정책:", 1)
          text = text.replace("- 설치형 PWA의 start URL에 V400.4 release key 포함", "- 설치형 PWA의 start URL에 V400.5 release key 포함", 1)
          write(path, text)

          # Permanent V400 release audit.
          path = "tools/audit_v400_release_polish.js"
          text = read(path)
          anchor = 'const readme = read("README.md");'
          if text.count(anchor) != 1:
              raise SystemExit("audit readme anchor mismatch")
          text = text.replace(anchor, anchor + '\nconst runtimeLoader = read("src/pwa/runtime_lesson_bundle_v400_5.js");\nconst koLessonBundle = JSON.parse(read("data/runtime/lesson_bundle_v400_5.json"));\nconst enLessonBundle = JSON.parse(read("data_i18n/en/runtime/lesson_bundle_v400_5.json"));\nconst koSupportBundle = JSON.parse(read("data/runtime/support_bundle_v400_5.json"));\nconst enSupportBundle = JSON.parse(read("data_i18n/en/runtime/support_bundle_v400_5.json"));', 1)
          replacements = [
              ('RELEASE = "20260821_v400_4"', 'RELEASE = "20260821_v400_5"'),
              ('root_release_v400_4', 'root_release_v400_5'),
              ('VERSION = "V400.4_RELEASE_POLISH_BOOT"', 'VERSION = "V400.5_RELEASE_POLISH_BOOT"'),
              ('boot_polish_v400_4', 'boot_polish_v400_5'),
              ('SW_URL = "./sw_v400_1.js?v=20260821_v400_4"', 'SW_URL = "./sw_v400_1.js?v=20260821_v400_5"'),
              ('service_worker_v400_4_registered', 'service_worker_v400_5_registered'),
              ('manifest.start_url === "./?release=20260821_v400_4"', 'manifest.start_url === "./?release=20260821_v400_5"'),
              ('CACHE_NAME = "python-reading-trainer-v400-4-20260821"', 'CACHE_NAME = "python-reading-trainer-v400-5-20260821"'),
              ('service_worker_cache_v400_4', 'service_worker_cache_v400_5'),
              ('readme.includes("현재 릴리즈: V400.4")', 'readme.includes("현재 릴리즈: V400.5")'),
          ]
          for old_value, new_value in replacements:
              if old_value not in text:
                  raise SystemExit(f"audit target missing: {old_value}")
              text = text.replace(old_value, new_value, 1)
          anchor = 'ok = assert(appIndex.includes(\'data-view="diagnostic"\'), "diagnostic_view_wired") && ok;'
          if text.count(anchor) != 1:
              raise SystemExit("audit index anchor mismatch")
          text = text.replace(anchor, anchor + '\nok = assert(appIndex.includes("runtime_lesson_bundle_v400_5.js?v=20260821_v400_5"), "runtime_bundle_loader_wired") && ok;\nok = assert(appIndex.indexOf("runtime_lesson_bundle_v400_5.js") < appIndex.indexOf("./app.js?"), "runtime_bundle_loader_before_app") && ok;', 1)
          anchor = 'ok = assert(!bootPolish.includes("prtDiagnosticEntryV4001"), "legacy_first_paint_card_removed") && ok;'
          if text.count(anchor) != 1:
              raise SystemExit("audit boot anchor mismatch")
          text = text.replace(anchor, anchor + '\n\nok = assert(runtimeLoader.includes(\'VERSION = "V400.5_RUNTIME_CONTENT_BUNDLES"\'), "runtime_bundle_loader_v400_5") && ok;\nok = assert(runtimeLoader.includes("window.fetch = function"), "runtime_bundle_fetch_interceptor") && ok;\nok = assert(runtimeLoader.includes("return nativeFetch(input, init)"), "runtime_bundle_native_fetch_fallback") && ok;\nok = assert(runtimeLoader.includes("support_bundle_v400_5.json"), "runtime_support_bundle_preload") && ok;', 1)
          anchor = 'ok = assert(sw.includes("v400_release_polish.js"), "visual_polish_precached") && ok;'
          if text.count(anchor) != 1:
              raise SystemExit("audit sw anchor mismatch")
          text = text.replace(anchor, anchor + '\nok = assert(sw.includes("runtime_lesson_bundle_v400_5.js"), "runtime_bundle_loader_precached") && ok;\n\nok = assert(koLessonBundle.card_count === 1785 && enLessonBundle.card_count === 1785, "runtime_lesson_bundle_card_count") && ok;\nok = assert(koLessonBundle.source_file_count === 98 && enLessonBundle.source_file_count === 98, "runtime_lesson_bundle_source_count") && ok;\nok = assert(Object.keys(koLessonBundle.files || {}).length === 98 && Object.keys(enLessonBundle.files || {}).length === 98, "runtime_lesson_bundle_file_map_count") && ok;\nok = assert(koSupportBundle.source_file_count > 0 && koSupportBundle.source_file_count === enSupportBundle.source_file_count, "runtime_support_bundle_source_count") && ok;\nok = assert(koSupportBundle.side_file_count > 0 && koSupportBundle.resource_file_count === 2, "runtime_support_bundle_group_counts") && ok;', 1)
          old = 'ok = assert(readme.includes("강제 reload/navigation 제거"), "readme_forced_reload_removed") && ok;'
          if text.count(old) != 1:
              raise SystemExit("audit README assertion target mismatch")
          text = text.replace(old, 'ok = assert(readme.includes("runtime lesson bundle 1개"), "readme_runtime_lesson_bundle") && ok;\n' + old, 1)
          write(path, text)

          # Permanent release gate adds bundle integrity and loader syntax.
          path = ".github/workflows/v400-release.yml"
          text = read(path)
          old = "          node --check src/pwa/release_polish_v400_1.js\n"
          if text.count(old) != 1:
              raise SystemExit("release gate JS anchor mismatch")
          text = text.replace(old, old + "          node --check src/pwa/runtime_lesson_bundle_v400_5.js\n", 1)
          anchor = "      - name: Existing lesson validation\n        run: python tools/validate_lessons.py\n"
          if text.count(anchor) != 1:
              raise SystemExit("release gate lesson anchor mismatch")
          runtime_step = """      - name: Runtime bundle integrity
        run: |
          python tools/build_runtime_lesson_bundle_v400_5.py
          python -m json.tool data/runtime/lesson_bundle_v400_5.json >/dev/null
          python -m json.tool data_i18n/en/runtime/lesson_bundle_v400_5.json >/dev/null
          python -m json.tool data/runtime/support_bundle_v400_5.json >/dev/null
          python -m json.tool data_i18n/en/runtime/support_bundle_v400_5.json >/dev/null
          git diff --exit-code -- data/runtime/lesson_bundle_v400_5.json data_i18n/en/runtime/lesson_bundle_v400_5.json data/runtime/support_bundle_v400_5.json data_i18n/en/runtime/support_bundle_v400_5.json

"""
          text = text.replace(anchor, runtime_step + anchor, 1)
          text = text.replace("V400.4 release polish audit", "V400.5 release polish audit", 1)
          write(path, text)
          PY

      - name: Validate V400.5
        run: |
          python tools/build_runtime_lesson_bundle_v400_5.py
          python tools/validate_lessons.py
          node --check src/pwa/runtime_lesson_bundle_v400_5.js
          node --check src/pwa/release_polish_v400_1.js
          node --check src/pwa/sw_v400_1.js
          node --check tools/audit_v400_release_polish.js
          node tools/audit_v400_release_polish.js
          git diff --exit-code -- data/runtime/lesson_bundle_v400_5.json data_i18n/en/runtime/lesson_bundle_v400_5.json data/runtime/support_bundle_v400_5.json data_i18n/en/runtime/support_bundle_v400_5.json
          git diff --check

      - name: Commit final V400.5 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md src/pwa/index.html tools/audit_v400_release_polish.js .github/workflows/v400-release.yml
          git rm -- .github/workflows/v400-5-finalize.yml
          git diff --cached --check
          git commit -m "V400.5: activate runtime content bundles"
          git pull --rebase origin main
          git push origin HEAD:main
