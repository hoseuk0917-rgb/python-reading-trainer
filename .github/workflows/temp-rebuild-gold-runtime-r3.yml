name: temp rebuild GOLD runtime R3

on:
  push:
    branches:
      - work/lesson-explanation-gold-representative-r3
    paths:
      - '.github/workflows/temp-rebuild-gold-runtime-r3.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/lesson-explanation-gold-representative-r3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild runtime bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Verify only lesson runtime bundles changed
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"

          test -n "$CHANGED"

          BAD="$(echo "$CHANGED" | grep -v -E '^(data/runtime/lesson_bundle_v400_5.json|data_i18n/en/runtime/lesson_bundle_v400_5.json)$' || true)"
          if [ -n "$BAD" ]; then
            echo "UNEXPECTED_GENERATED_DIFF:"
            echo "$BAD"
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          for path, language in [
              (Path("data/runtime/lesson_bundle_v400_5.json"), "ko"),
              (Path("data_i18n/en/runtime/lesson_bundle_v400_5.json"), "en"),
          ]:
              payload = json.loads(path.read_text(encoding="utf-8-sig"))
              assert payload["schema"] == "python-reading-trainer/runtime-lesson-bundle-v1"
              assert payload["language"] == language
              assert payload["source_file_count"] == 98
              assert payload["card_count"] == 1785
              print(f"{language.upper()}_RUNTIME_CARD_COUNT={payload['card_count']}")
          PY

      - name: Commit generated bundles and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             data/runtime/lesson_bundle_v400_5.json             data_i18n/en/runtime/lesson_bundle_v400_5.json

          git rm .github/workflows/temp-rebuild-gold-runtime-r3.yml

          git commit -m "Rebuild runtime lesson bundles for representative GOLD"
          git push origin HEAD:work/lesson-explanation-gold-representative-r3

          echo "RUNTIME_REBUILD_PUSHED=True"
