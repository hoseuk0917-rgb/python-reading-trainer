name: Lesson explanation source-backed canary R1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/run_lesson_explanation_source_backed_r1.py'
      - 'tools/run_lesson_explanation_api_pilot_r1.py'
      - 'tools/plan_source_backed_explanation_r1.py'
      - 'tools/audit_source_bundle_mapping_r1.py'
      - 'tools/audit_explanation_readiness_r1.py'
      - 'docs/LESSON_EXPLANATION_CONTRACT_V1.md'
      - '.github/workflows/lesson-explanation-source-backed-canary-r1.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the 10-card official-source web-search canary'
        required: false
        default: false
        type: boolean
      limit:
        description: 'Source-backed canary card count; maximum 10'
        required: false
        default: '10'
        type: string
      resume_run_id:
        description: 'Optional failed canary run ID whose validated provenance should be resumed'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: lesson-explanation-source-backed-canary-r1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile source-backed runner
        run: python -m py_compile tools/run_lesson_explanation_source_backed_r1.py

      - name: Source-backed runner self-test
        run: python tools/run_lesson_explanation_source_backed_r1.py --self-test

      - name: Deterministic current 10-card source-backed plan
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_lesson_explanation_source_backed_r1.py --plan --limit 10 \
            | tee "$RUNNER_TEMP/source-backed-canary-plan.txt"

          grep -F 'SOURCE_READY_INVENTORY=' "$RUNNER_TEMP/source-backed-canary-plan.txt"
          grep -F 'SOURCE_BACKED_LIMIT=10' "$RUNNER_TEMP/source-backed-canary-plan.txt"
          grep -F 'SOURCE_BACKED_EXPLICIT_SELECTION=NO' "$RUNNER_TEMP/source-backed-canary-plan.txt"
          grep -F 'SOURCE_BACKED_SELECTION_SHA256=' "$RUNNER_TEMP/source-backed-canary-plan.txt"
          grep -F 'LESSON_EXPLANATION_SOURCE_BACKED_R1_PLAN=PASS' \
            "$RUNNER_TEMP/source-backed-canary-plan.txt"

      - name: Verify remaining source inventory
        run: python tools/plan_source_backed_explanation_r1.py --limit 0

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOURCE_BRANCH: automation/lesson-explanation-source-backed-canary-r1

    steps:
      - name: Check out full repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Require API key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Prepare clean source-backed canary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null 2>&1; then
            echo "Source-backed canary branch already exists: $SOURCE_BRANCH"
            exit 1
          fi

          git checkout -b "$SOURCE_BRANCH" origin/main

      - name: Download resume provenance
        if: inputs.resume_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESUME_RUN_ID="${{ inputs.resume_run_id }}"
          if ! [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "resume_run_id must be numeric: $RESUME_RUN_ID"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/resume"
          gh run download "$RESUME_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name lesson-explanation-source-backed-canary-r1 \
            --dir "$RUNNER_TEMP/resume"

          test -f "$RUNNER_TEMP/resume/lesson-explanation-source-backed-canary-r1.jsonl"

      - name: Run source-backed canary
        shell: bash
        run: |
          set -euo pipefail
          LIMIT="${{ inputs.limit }}"
          RESUME_RUN_ID="${{ inputs.resume_run_id }}"

          if ! [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "limit must be a positive integer: $LIMIT"
            exit 1
          fi
          if [ "$LIMIT" -gt 10 ]; then
            echo "source-backed canary limit may not exceed 10"
            exit 1
          fi

          ARGS=(
            --live
            --limit "$LIMIT"
            --model gpt-6.1-sol
            --result-path "$RUNNER_TEMP/lesson-explanation-source-backed-canary-r1.jsonl"
            --hold-path "$RUNNER_TEMP/lesson-explanation-source-backed-canary-r1-holds.jsonl"
            --max-total-tokens 500000
            --max-holds 3
          )

          if [ -n "$RESUME_RUN_ID" ]; then
            ARGS+=(
              --resume-result-path
              "$RUNNER_TEMP/resume/lesson-explanation-source-backed-canary-r1.jsonl"
            )
          fi

          python tools/run_lesson_explanation_source_backed_r1.py "${ARGS[@]}"

      - name: Rebuild runtime lesson bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Validate generated lessons
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py
          python tools/audit_explanation_readiness_r1.py --limit 0 \
            | tee "$RUNNER_TEMP/explanation-readiness-after.txt"

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "lesson-explanation-source-backed-canary-r1.jsonl"
          rows = [
              json.loads(line)
              for line in result_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if not rows:
              raise SystemExit("source-backed canary result artifact is empty")

          allowed = {
              "data/runtime/lesson_bundle_v400_5.json",
              "data_i18n/en/runtime/lesson_bundle_v400_5.json",
          }
          for row in rows:
              filename = row["file"]
              allowed.add(f"data/lessons/{filename}")
              allowed.add(f"data_i18n/en/lessons/{filename}")

          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected changed files: {unexpected}")

          print(f"SOURCE_BACKED_CHANGED_FILE_COUNT={len(changed)}")
          print(f"SOURCE_BACKED_RESULT_ROW_COUNT={len(rows)}")
          print("LESSON_EXPLANATION_SOURCE_BACKED_CANARY_R1_DIFF_BOUNDARY=PASS")
          PY

          git diff --quiet -- \
            data/runtime/support_bundle_v400_5.json \
            data_i18n/en/runtime/support_bundle_v400_5.json
          git diff --check

      - name: Commit and push reviewed source-backed canary branch
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/lessons \
            data_i18n/en/lessons \
            data/runtime/lesson_bundle_v400_5.json \
            data_i18n/en/runtime/lesson_bundle_v400_5.json

          if git diff --cached --quiet; then
            echo "No source-backed canary changes to commit."
            exit 1
          fi

          git commit -m "Generate 10-card source-backed lesson explanation canary R1"
          git push -u origin "$SOURCE_BRANCH"
          echo "SOURCE_BACKED_CANARY_BRANCH_READY=$SOURCE_BRANCH"

      - name: Upload source-backed canary provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lesson-explanation-source-backed-canary-r1
          path: |
            ${{ runner.temp }}/lesson-explanation-source-backed-canary-r1.jsonl
            ${{ runner.temp }}/lesson-explanation-source-backed-canary-r1-holds.jsonl
            ${{ runner.temp }}/explanation-readiness-after.txt
          if-no-files-found: warn
          retention-days: 14
