name: Extract choice defects V400

on:
  push:
    branches:
      - main
    paths:
      - "tools/extract_choice_defects_v400.py"
      - ".github/workflows/extract-choice-defects-v400.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract target card contexts
        run: python tools/extract_choice_defects_v400.py
