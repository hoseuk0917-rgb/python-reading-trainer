name: Repair display-duplicate lesson choices V400

on:
  push:
    branches:
      - main
    paths:
      - "tools/repair_display_duplicate_choices_v400.py"
      - ".github/workflows/repair-display-duplicate-choices-v400.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Exact guarded repair
        run: python tools/repair_display_duplicate_choices_v400.py

      - name: Rebuild runtime bundles
        run: python tools/build_runtime_lesson_bundle_v400_5.py

      - name: Exhaustive lesson validation
        run: |
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py

      - name: Diff scope and whitespace integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          allowed='^(data/lessons/(cards_seed_v1|python_foundation_expansion_v10|python_rag_kg_pipeline_review_v16|python_search_embedding_rag_flow_v43)\.json|data_i18n/en/lessons/(cards_seed_v1|python_foundation_expansion_v10|python_rag_kg_pipeline_review_v16|python_search_embedding_rag_flow_v43|python_broad_expansion_v3|python_function_design_io_v30|python_pwa_install_update_ux_v51|python_accessibility_a11y_ui_v52|python_data_governance_copyright_v57|python_i18n_locale_language_toggle_v62|python_foundation_beginner_v94_a1_part2|python_foundation_level2_v94_a2_part2|python_foundation_level3_v95_a1_functions|python_regex_beginner_v124_a1)\.json|data/runtime/(lesson_bundle_v400_5|support_bundle_v400_5)\.json|data_i18n/en/runtime/(lesson_bundle_v400_5|support_bundle_v400_5)\.json)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "UNEXPECTED_DIFF_PATHS=True"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "DIFF_SCOPE_PASS=True"
          git diff --name-only

      - name: Commit repaired sources and bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/lessons/cards_seed_v1.json \
            data/lessons/python_foundation_expansion_v10.json \
            data/lessons/python_rag_kg_pipeline_review_v16.json \
            data/lessons/python_search_embedding_rag_flow_v43.json \
            data_i18n/en/lessons/cards_seed_v1.json \
            data_i18n/en/lessons/python_foundation_expansion_v10.json \
            data_i18n/en/lessons/python_rag_kg_pipeline_review_v16.json \
            data_i18n/en/lessons/python_search_embedding_rag_flow_v43.json \
            data_i18n/en/lessons/python_broad_expansion_v3.json \
            data_i18n/en/lessons/python_function_design_io_v30.json \
            data_i18n/en/lessons/python_pwa_install_update_ux_v51.json \
            data_i18n/en/lessons/python_accessibility_a11y_ui_v52.json \
            data_i18n/en/lessons/python_data_governance_copyright_v57.json \
            data_i18n/en/lessons/python_i18n_locale_language_toggle_v62.json \
            data_i18n/en/lessons/python_foundation_beginner_v94_a1_part2.json \
            data_i18n/en/lessons/python_foundation_level2_v94_a2_part2.json \
            data_i18n/en/lessons/python_foundation_level3_v95_a1_functions.json \
            data_i18n/en/lessons/python_regex_beginner_v124_a1.json \
            data/runtime/lesson_bundle_v400_5.json \
            data_i18n/en/runtime/lesson_bundle_v400_5.json \
            data/runtime/support_bundle_v400_5.json \
            data_i18n/en/runtime/support_bundle_v400_5.json
          if git diff --cached --quiet; then
            echo "NO_REPAIR_DIFF=True"
            exit 1
          fi
          git commit -m "Fix exhaustive lesson choice defects"
          git push origin HEAD:main
