name: One-off V400.8 beginner learner-text re-audit

on:
  push:
    branches: [main]
    paths: [".github/workflows/oneoff-v4008-beginner-text-quality.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fixes and persist audit
        shell: bash
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          ROOT = Path.cwd()
          runtime = ROOT / "src/pwa/v400_pedagogy_runtime.js"
          app = ROOT / "src/pwa/app.js"
          sw = ROOT / "src/pwa/sw_v400_1.js"
          en_seed = ROOT / "data_i18n/en/lessons/cards_seed_v1.json"

          def rx(path, old, new, count=1):
              text = path.read_text(encoding="utf-8-sig")
              n = text.count(old)
              if n != count:
                  raise SystemExit(f"replace mismatch {path}: expected={count} actual={n} old={old[:100]!r}")
              path.write_text(text.replace(old, new, count), encoding="utf-8")

          rx(runtime, 'const VERSION = "v400_v2_3_quality3";', 'const VERSION = "v400_v2_3_quality4";')
          rx(runtime,
             '    return String(value == null ? "" : value)\n      .replace(/`([^`]+)`/g, "$1")\n      .replace(/\\*\\*([^*]+)\\*\\*/g, "$1")\n      .trim();',
             '    return String(value == null ? "" : value)\n      .replace(/``([^`]+)``/g, "$1")\n      .replace(/`([^`]+)`/g, "$1")\n      .replace(/\\*\\*([^*]+)\\*\\*/g, "$1")\n      .trim();')
          rx(runtime,
             '      [/\\breceiver\\b/gi, "점(.) 왼쪽의 대상 객체"],\n      [/\\barguments?\\b/gi, "함수에 전달하는 값(인자)"],\n      [/\\bparameters?\\b/gi, "함수가 받는 이름(매개변수)"],\n      [/\\bcall\\b/g, "함수 호출"],\n      [/\\bassignment\\b/g, "값 저장"],\n      [/\\bliteral\\b/g, "코드에 직접 적은 값"]',
             '      [/\\breceiver\\b/gi, "점(.) 왼쪽의 대상 객체"],\n      [/\\barguments?\\b/gi, "함수에 전달하는 값(인자)"],\n      [/\\bparameters?\\b/gi, "함수가 받는 이름(매개변수)"]')
          rx(runtime,
             '    return text\n      .replace(/\\bI explicitly specified\\b/g, "The code explicitly specifies")\n      .replace(/\\bAs you can see,\\s*/g, "")\n      .replace(/\\bYou can interpret this as\\b/g, "Read this as")\n      .replace(/\\bPoint of Misinterpretation:\\s*/g, "Where it went wrong: ")\n      .replace(/\\bA common source of confusion:\\s*/g, "Common mistake: ");',
             '    return text\n      .replace(/^([A-Za-z_][A-Za-z0-9_.]*\\([^)]*\\))\\s+This is a function that\\b/g, "$1 is a function that")\n      .replace(/^([A-Za-z_][A-Za-z0-9_.]*\\([^)]*\\))\\s+As you can see,\\s*it first counts\\b/g, "For $1, first count")\n      .replace(/^([A-Za-z_][A-Za-z0-9_.]*\\([^)]*\\))\\s+When I look at this,\\s*I interpret it as\\b/g, "Read $1 as")\n      .replace(/\\bI explicitly specified\\b/g, "The code explicitly specifies")\n      .replace(/\\bAs you can see,\\s*/g, "")\n      .replace(/\\bYou can interpret this as\\b/g, "Read this as")\n      .replace(/\\bWhen I look at this,\\s*I interpret it as\\b/g, "Read this as")\n      .replace(/\\bPoint of Misinterpretation:\\s*/g, "Where it went wrong: ")\n      .replace(/\\bA common source of confusion:\\s*/g, "Common mistake: ");')

          rx(app,
             'function renderCard() {\n  const card = getCurrentCard();\n  selectedChoice = null;',
             'function renderCard() {\n  const card = getCurrentCard();\n  const runtimeV400 = window.V400PedagogyRuntime;\n  const learnerTextV400 = runtimeV400\n    && typeof runtimeV400.learnerText === "function"\n    && typeof runtimeV400.isRichCard === "function"\n    && runtimeV400.isRichCard(card)\n      ? runtimeV400.learnerText\n      : function (_card, value) { return String(value == null ? "" : value); };\n  selectedChoice = null;')
          rx(app, '  document.getElementById("cardTitle").textContent = card.title;', '  document.getElementById("cardTitle").textContent = learnerTextV400(card, card.title);')
          rx(app,
             '  document.getElementById("questionText").textContent = card.question || "";\n  document.getElementById("projectContext").textContent = card.project_context || "";',
             '  document.getElementById("questionText").textContent = learnerTextV400(card, card.question || "");\n  document.getElementById("projectContext").textContent = learnerTextV400(card, card.project_context || "");')
          rx(app,
             '    btn.textContent = Array.isArray(choice) ? choice.join(", ") : String(choice);',
             '    const choiceText = Array.isArray(choice) ? choice.join(", ") : String(choice);\n    btn.textContent = learnerTextV400(card, choiceText);')

          seed = json.loads(en_seed.read_text(encoding="utf-8-sig"))
          by_id = {x.get("id"): x for x in seed if isinstance(x, dict)}
          l01 = by_id["L01_len_001"]
          l01["concept_explanation"]["what_it_is"] = "`len()` returns the number of items in a list or string. For example, `['A', 'B', 'C']` contains three items, so its length is 3."
          l01["concept_explanation"]["how_to_read"] = "For `len(items)`, count the items currently inside `items`; that count is the returned number."
          l01["answer_explanation"]["takeaway"] = "Read `len()` as the number of items, not the last index."
          by_id["L02_var_flow_001"]["concept_explanation"]["common_mistake"] = "It is easy to think `name` receives the letters `label`. Because `label` has no quotes, Python reads the value currently stored in that variable instead."
          l03d = by_id["L03_dict_001"]
          l03d["question"] = "What should go in `node[____]` to retrieve `Sensor`?"
          l03d["teaching_example"]["walkthrough"] = "Using the key `\"kind\"` returns its associated value, `\"Sensor\"`. Put the key—not the desired value—inside the square brackets."
          l03g = by_id["L03_get_001"]
          l03g["question"] = "What does `row.get(\"doc_id\", \"NO_DOC\")` return?"
          l03g["answer_explanation"]["common_wrong_choice"]["why_wrong"] = "The code explicitly provides `NO_DOC` as the second argument, so `get()` returns that default value when `doc_id` is missing."
          en_seed.write_text(json.dumps(seed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          rx(sw,
             'const RELEASE = "20260827_v400_8_beginner_quality2";\nconst CACHE_NAME = "python-reading-trainer-v400-8-beginner-quality2-20260827";',
             'const RELEASE = "20260827_v400_8_beginner_quality4";\nconst CACHE_NAME = "python-reading-trainer-v400-8-beginner-quality4-20260827";')

          subprocess.run(["python", "tools/build_runtime_lesson_bundle_v400_5.py"], check=True)
          ko = json.loads((ROOT / "data/runtime/lesson_bundle_v400_5.json").read_text(encoding="utf-8"))
          en = json.loads((ROOT / "data_i18n/en/runtime/lesson_bundle_v400_5.json").read_text(encoding="utf-8"))
          assert ko["card_count"] == en["card_count"] == 1785

          def cards(bundle):
              for rel, rows in bundle["files"].items():
                  for row in rows:
                      yield rel, row

          def fields(card):
              out=[]
              for key in ("title","question","project_context"):
                  if isinstance(card.get(key),str): out.append((key,card[key]))
              for i,v in enumerate(card.get("choices") or []):
                  if isinstance(v,str): out.append((f"choices[{i}]",v))
              def walk(node,path):
                  if isinstance(node,str):
                      if not path.endswith(".code"): out.append((path,node))
                  elif isinstance(node,dict):
                      for k,v in node.items(): walk(v,f"{path}.{k}")
                  elif isinstance(node,list):
                      for i,v in enumerate(node): walk(v,f"{path}[{i}]")
              for sec in ("concept_explanation","teaching_example","answer_explanation"): walk(card.get(sec),sec)
              return out

          forbidden=["Point of Misinterpretation:","A common source of confusion:","As you can see,","I explicitly specified","You can interpret this as","When I look at this, I interpret it as"]
          tokens={"sequence_operation":"processing values in order","name_reference":"reading a variable's current value","attribute_access":"attribute access with a dot","argument_passing":"passing an argument","parameter_definition":"defining a parameter","function_definition":"defining a function","return_statement":"returning a result","if_statement":"an if statement","else_clause":"an else branch","for_statement":"a for loop","while_statement":"a while loop","membership_test":"checking whether a value is included","identity_test":"checking object identity","boolean_operation":"a Boolean operation","conditional_expression":"a conditional expression"}
          def shown_en(text):
              text=re.sub(r"``([^`]+)``",r"\1",text); text=re.sub(r"`([^`]+)`",r"\1",text); text=re.sub(r"\*\*([^*]+)\*\*",r"\1",text)
              for a,b in tokens.items(): text=re.sub(rf"\b{re.escape(a)}\b",b,text)
              text=re.sub(r"^([A-Za-z_][A-Za-z0-9_.]*\([^)]*\))\s+This is a function that\b",r"\1 is a function that",text)
              text=re.sub(r"^([A-Za-z_][A-Za-z0-9_.]*\([^)]*\))\s+As you can see,\s*it first counts\b",r"For \1, first count",text)
              text=re.sub(r"^([A-Za-z_][A-Za-z0-9_.]*\([^)]*\))\s+When I look at this,\s*I interpret it as\b",r"Read \1 as",text)
              text=re.sub(r"\bI explicitly specified\b","The code explicitly specifies",text)
              text=re.sub(r"\bAs you can see,\s*","",text); text=re.sub(r"\bYou can interpret this as\b","Read this as",text); text=re.sub(r"\bWhen I look at this,\s*I interpret it as\b","Read this as",text)
              text=re.sub(r"\bPoint of Misinterpretation:\s*","Where it went wrong: ",text); text=re.sub(r"\bA common source of confusion:\s*","Common mistake: ",text)
              return text.strip()

          report={"schema":"python-reading-trainer/v4008-learner-text-reaudit-v2","ko_card_count":1785,"en_card_count":1785,"ko_source_file_count":ko["source_file_count"],"en_source_file_count":en["source_file_count"],"raw_beginner_en_forbidden_count":0,"raw_beginner_en_double_backtick_count":0,"post_runtime_beginner_en_forbidden_count":0,"post_runtime_beginner_en_backtick_count":0,"raw_beginner_ko_author_token_count":0,"samples":{"raw_en_forbidden":[],"raw_en_double_backtick":[],"post_en":[],"raw_ko_author_token":[]}}
          ko_token_re=re.compile(r"\b(?:name_reference|if_statement|else_clause|for_statement|return_statement|attribute_access|argument_passing|parameter_definition|membership_test|identity_test|sequence_operation)\b")
          for rel,c in cards(en):
              try: level=int(c.get("level",999))
              except: level=999
              if level>3: continue
              for field,value in fields(c):
                  hits=[p for p in forbidden if p in value]
                  if hits:
                      report["raw_beginner_en_forbidden_count"]+=1
                      if len(report["samples"]["raw_en_forbidden"])<30: report["samples"]["raw_en_forbidden"].append({"file":rel,"id":c.get("id"),"field":field,"hits":hits,"sample":value[:260]})
                  if "``" in value:
                      report["raw_beginner_en_double_backtick_count"]+=1
                      if len(report["samples"]["raw_en_double_backtick"])<30: report["samples"]["raw_en_double_backtick"].append({"file":rel,"id":c.get("id"),"field":field,"sample":value[:260]})
                  visible=shown_en(value); post=[p for p in forbidden if p in visible]
                  if post:
                      report["post_runtime_beginner_en_forbidden_count"]+=1
                      if len(report["samples"]["post_en"])<30: report["samples"]["post_en"].append({"file":rel,"id":c.get("id"),"field":field,"hits":post,"sample":visible[:260]})
                  if "`" in visible: report["post_runtime_beginner_en_backtick_count"]+=1
          for rel,c in cards(ko):
              try: level=int(c.get("level",999))
              except: level=999
              if level>3: continue
              for field,value in fields(c):
                  hits=sorted(set(ko_token_re.findall(value)))
                  if hits:
                      report["raw_beginner_ko_author_token_count"]+=1
                      if len(report["samples"]["raw_ko_author_token"])<30: report["samples"]["raw_ko_author_token"].append({"file":rel,"id":c.get("id"),"field":field,"hits":hits,"sample":value[:260]})
          audit=ROOT/"docs/audits/v4008_learner_text_reaudit.json"; audit.parent.mkdir(parents=True,exist_ok=True); audit.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("LEARNER_TEXT_REAUDIT="+json.dumps(report,ensure_ascii=False,separators=(",",":")))
          (ROOT/".github/workflows/oneoff-v4008-beginner-text-quality.yml").unlink()
          PY
      - name: Release-equivalent checks
        run: |
          node --check src/pwa/app.js
          node --check src/pwa/v400_pedagogy_runtime.js
          node --check src/pwa/sw_v400_1.js
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py
          python tools/validate_diagnostic_v400_7.py
          node tools/audit_v400_release_polish.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Re-audit beginner learner text and repair residual artifacts"
          git push origin HEAD:main
