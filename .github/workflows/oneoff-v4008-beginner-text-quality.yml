name: One-off V400.8 beginner learner-text re-audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oneoff-v4008-beginner-text-quality.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply re-audit fixes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          runtime = ROOT / "src/pwa/v400_pedagogy_runtime.js"
          app = ROOT / "src/pwa/app.js"
          sw = ROOT / "src/pwa/sw_v400_1.js"
          en_seed = ROOT / "data_i18n/en/lessons/cards_seed_v1.json"

          def replace_exact(path: Path, old: str, new: str, count: int = 1) -> None:
              text = path.read_text(encoding="utf-8-sig")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"unexpected occurrence count in {path}: expected={count} actual={found} old={old[:100]!r}")
              path.write_text(text.replace(old, new, count), encoding="utf-8")

          # Runtime hardening: double-backtick cleanup, safer Korean substitutions,
          # and defensive English repairs for known translated sentence shapes.
          replace_exact(runtime,
              'const VERSION = "v400_v2_3_quality3";',
              'const VERSION = "v400_v2_3_quality4";')
          replace_exact(runtime,
              '    return String(value == null ? "" : value)\n      .replace(/`([^`]+)`/g, "$1")\n      .replace(/\\*\\*([^*]+)\\*\\*/g, "$1")\n      .trim();',
              '    return String(value == null ? "" : value)\n      .replace(/``([^`]+)``/g, "$1")\n      .replace(/`([^`]+)`/g, "$1")\n      .replace(/\\*\\*([^*]+)\\*\\*/g, "$1")\n      .trim();')
          replace_exact(runtime,
              '      [/\\breceiver\\b/gi, "점(.) 왼쪽의 대상 객체"],\n      [/\\barguments?\\b/gi, "함수에 전달하는 값(인자)"],\n      [/\\bparameters?\\b/gi, "함수가 받는 이름(매개변수)"],\n      [/\\bcall\\b/g, "함수 호출"],\n      [/\\bassignment\\b/g, "값 저장"],\n      [/\\bliteral\\b/g, "코드에 직접 적은 값"]',
              '      [/\\breceiver\\b/gi, "점(.) 왼쪽의 대상 객체"],\n      [/\\barguments?\\b/gi, "함수에 전달하는 값(인자)"],\n      [/\\bparameters?\\b/gi, "함수가 받는 이름(매개변수)"]')
          replace_exact(runtime,
              '    return text\n      .replace(/\\bI explicitly specified\\b/g, "The code explicitly specifies")\n      .replace(/\\bAs you can see,\\s*/g, "")\n      .replace(/\\bYou can interpret this as\\b/g, "Read this as")\n      .replace(/\\bPoint of Misinterpretation:\\s*/g, "Where it went wrong: ")\n      .replace(/\\bA common source of confusion:\\s*/g, "Common mistake: ");',
              '    return text\n      .replace(/^([A-Za-z_][A-Za-z0-9_.]*\\([^)]*\\))\\s+This is a function that\\b/g, "$1 is a function that")\n      .replace(/^([A-Za-z_][A-Za-z0-9_.]*\\([^)]*\\))\\s+As you can see,\\s*it first counts\\b/g, "For $1, first count")\n      .replace(/^([A-Za-z_][A-Za-z0-9_.]*\\([^)]*\\))\\s+When I look at this,\\s*I interpret it as\\b/g, "Read $1 as")\n      .replace(/\\bI explicitly specified\\b/g, "The code explicitly specifies")\n      .replace(/\\bAs you can see,\\s*/g, "")\n      .replace(/\\bYou can interpret this as\\b/g, "Read this as")\n      .replace(/\\bWhen I look at this,\\s*I interpret it as\\b/g, "Read this as")\n      .replace(/\\bPoint of Misinterpretation:\\s*/g, "Where it went wrong: ")\n      .replace(/\\bA common source of confusion:\\s*/g, "Common mistake: ");')

          # The base renderer previously bypassed learnerText for these fields.
          replace_exact(app,
              'function renderCard() {\n  const card = getCurrentCard();\n  selectedChoice = null;',
              'function renderCard() {\n  const card = getCurrentCard();\n  const runtimeV400 = window.V400PedagogyRuntime;\n  const learnerTextV400 = runtimeV400\n    && typeof runtimeV400.learnerText === "function"\n    && typeof runtimeV400.isRichCard === "function"\n    && runtimeV400.isRichCard(card)\n      ? runtimeV400.learnerText\n      : function (_card, value) { return String(value == null ? "" : value); };\n  selectedChoice = null;')
          replace_exact(app,
              '  document.getElementById("cardTitle").textContent = card.title;',
              '  document.getElementById("cardTitle").textContent = learnerTextV400(card, card.title);')
          replace_exact(app,
              '  document.getElementById("questionText").textContent = card.question || "";\n  document.getElementById("projectContext").textContent = card.project_context || "";',
              '  document.getElementById("questionText").textContent = learnerTextV400(card, card.question || "");\n  document.getElementById("projectContext").textContent = learnerTextV400(card, card.project_context || "");')
          replace_exact(app,
              '    btn.textContent = Array.isArray(choice) ? choice.join(", ") : String(choice);',
              '    const choiceText = Array.isArray(choice) ? choice.join(", ") : String(choice);\n    btn.textContent = learnerTextV400(card, choiceText);')

          # Patch confirmed English defects semantically by card ID + field rather than
          # depending on the source JSON's whitespace/Unicode escape serialization.
          seed = json.loads(en_seed.read_text(encoding="utf-8-sig"))
          if not isinstance(seed, list):
              raise SystemExit("English seed is not a list")
          by_id = {row.get("id"): row for row in seed if isinstance(row, dict)}
          required = {"L01_len_001", "L02_var_flow_001", "L03_dict_001", "L03_get_001"}
          missing = required - set(by_id)
          if missing:
              raise SystemExit(f"missing seed cards: {sorted(missing)}")

          l01 = by_id["L01_len_001"]
          l01["concept_explanation"]["what_it_is"] = "`len()` returns the number of items in a list or string. For example, `['A', 'B', 'C']` contains three items, so its length is 3."
          l01["concept_explanation"]["how_to_read"] = "For `len(items)`, count the items currently inside `items`; that count is the returned number."
          l01["answer_explanation"]["takeaway"] = "Read `len()` as the number of items, not the last index."

          l02 = by_id["L02_var_flow_001"]
          l02["concept_explanation"]["common_mistake"] = "It is easy to think `name` receives the letters `label`. Because `label` has no quotes, Python reads the value currently stored in that variable instead."

          l03d = by_id["L03_dict_001"]
          l03d["question"] = "What should go in `node[____]` to retrieve `Sensor`?"
          l03d["teaching_example"]["walkthrough"] = "Using the key `\"kind\"` returns its associated value, `\"Sensor\"`. Put the key—not the desired value—inside the square brackets."

          l03g = by_id["L03_get_001"]
          l03g["question"] = "What does `row.get(\"doc_id\", \"NO_DOC\")` return?"
          l03g["answer_explanation"]["common_wrong_choice"]["why_wrong"] = "The code explicitly provides `NO_DOC` as the second argument, so `get()` returns that default value when `doc_id` is missing."

          en_seed.write_text(json.dumps(seed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Cache bump so app/runtime changes are not masked by the previous PWA shell.
          replace_exact(sw,
              'const RELEASE = "20260827_v400_8_beginner_quality2";\nconst CACHE_NAME = "python-reading-trainer-v400-8-beginner-quality2-20260827";',
              'const RELEASE = "20260827_v400_8_beginner_quality4";\nconst CACHE_NAME = "python-reading-trainer-v400-8-beginner-quality4-20260827";')

          subprocess.run(["python", "tools/build_runtime_lesson_bundle_v400_5.py"], check=True)
          ko_bundle = json.loads((ROOT / "data/runtime/lesson_bundle_v400_5.json").read_text(encoding="utf-8"))
          en_bundle = json.loads((ROOT / "data_i18n/en/runtime/lesson_bundle_v400_5.json").read_text(encoding="utf-8"))
          if (ko_bundle.get("card_count"), en_bundle.get("card_count")) != (1785, 1785):
              raise SystemExit("card-count regression")

          def iter_cards(bundle):
              for rel, rows in bundle.get("files", {}).items():
                  for row in rows:
                      yield rel, row

          def visible_strings(card):
              out = []
              for key in ("title", "question", "project_context"):
                  value = card.get(key)
                  if isinstance(value, str):
                      out.append((key, value))
              for i, value in enumerate(card.get("choices") or []):
                  if isinstance(value, str):
                      out.append((f"choices[{i}]", value))
              for section in ("concept_explanation", "teaching_example", "answer_explanation"):
                  def walk(node, path):
                      if isinstance(node, str):
                          if not path.endswith(".code"):
                              out.append((path, node))
                      elif isinstance(node, dict):
                          for k, v in node.items():
                              walk(v, f"{path}.{k}")
                      elif isinstance(node, list):
                          for i, v in enumerate(node):
                              walk(v, f"{path}[{i}]")
                  walk(card.get(section), section)
              return out

          forbidden_en = [
              "Point of Misinterpretation:", "A common source of confusion:",
              "As you can see,", "I explicitly specified", "You can interpret this as",
              "When I look at this, I interpret it as",
          ]
          author_token_re = re.compile(r"\b(?:name_reference|if_statement|else_clause|for_statement|return_statement|attribute_access|argument_passing|parameter_definition|membership_test|identity_test|sequence_operation)\b")

          # Mirror the display cleanup relevant to this audit. This is intentionally
          # narrower than executing the browser; it verifies the strings fed to learner UI.
          token_labels_en = {
              "sequence_operation": "processing values in order",
              "name_reference": "reading a variable's current value",
              "attribute_access": "attribute access with a dot",
              "argument_passing": "passing an argument",
              "parameter_definition": "defining a parameter",
              "function_definition": "defining a function",
              "return_statement": "returning a result",
              "if_statement": "an if statement", "else_clause": "an else branch",
              "for_statement": "a for loop", "while_statement": "a while loop",
              "membership_test": "checking whether a value is included",
              "identity_test": "checking object identity",
              "boolean_operation": "a Boolean operation",
              "conditional_expression": "a conditional expression",
          }
          def display_en(text):
              text = re.sub(r"``([^`]+)``", r"\1", text)
              text = re.sub(r"`([^`]+)`", r"\1", text)
              text = re.sub(r"\*\*([^*]+)\*\*", r"\1", text)
              for token, label in token_labels_en.items():
                  text = re.sub(rf"\b{re.escape(token)}\b", label, text)
              text = re.sub(r"^([A-Za-z_][A-Za-z0-9_.]*\([^)]*\))\s+This is a function that\b", r"\1 is a function that", text)
              text = re.sub(r"^([A-Za-z_][A-Za-z0-9_.]*\([^)]*\))\s+As you can see,\s*it first counts\b", r"For \1, first count", text)
              text = re.sub(r"^([A-Za-z_][A-Za-z0-9_.]*\([^)]*\))\s+When I look at this,\s*I interpret it as\b", r"Read \1 as", text)
              text = re.sub(r"\bI explicitly specified\b", "The code explicitly specifies", text)
              text = re.sub(r"\bAs you can see,\s*", "", text)
              text = re.sub(r"\bYou can interpret this as\b", "Read this as", text)
              text = re.sub(r"\bWhen I look at this,\s*I interpret it as\b", "Read this as", text)
              text = re.sub(r"\bPoint of Misinterpretation:\s*", "Where it went wrong: ", text)
              text = re.sub(r"\bA common source of confusion:\s*", "Common mistake: ", text)
              return text.strip()

          report = {
              "schema": "python-reading-trainer/v4008-learner-text-reaudit-v2",
              "ko_card_count": ko_bundle["card_count"],
              "en_card_count": en_bundle["card_count"],
              "ko_source_file_count": ko_bundle["source_file_count"],
              "en_source_file_count": en_bundle["source_file_count"],
              "scope": "all 1785 KO and 1785 EN lesson cards structurally scanned; learner-visible Level 1-3 strings re-audited",
              "confirmed_repairs": [
                  "English L01 len() grammar and takeaway",
                  "English L02 stray leading code token",
                  "English L03 dictionary question grammar",
                  "English L03 dictionary walkthrough semantic error",
                  "English L03 dict.get() question and wrong-choice wording",
                  "double-backtick learner rendering",
                  "Korean overbroad call/assignment/literal replacement",
                  "raw title/question/context/choice rendering bypass",
              ],
              "raw_beginner_en_forbidden_count": 0,
              "raw_beginner_en_double_backtick_count": 0,
              "post_runtime_beginner_en_forbidden_count": 0,
              "post_runtime_beginner_en_backtick_count": 0,
              "raw_beginner_ko_author_token_count": 0,
              "samples": {"raw_en_forbidden": [], "raw_en_double_backtick": [], "post_en": [], "raw_ko_author_token": []},
          }

          for rel, card in iter_cards(en_bundle):
              try: level = int(card.get("level", 999))
              except Exception: level = 999
              if level > 3: continue
              for field, value in visible_strings(card):
                  hits = [p for p in forbidden_en if p in value]
                  if hits:
                      report["raw_beginner_en_forbidden_count"] += 1
                      if len(report["samples"]["raw_en_forbidden"]) < 30:
                          report["samples"]["raw_en_forbidden"].append({"file": rel, "id": card.get("id"), "field": field, "hits": hits, "sample": value[:240]})
                  if "``" in value:
                      report["raw_beginner_en_double_backtick_count"] += 1
                      if len(report["samples"]["raw_en_double_backtick"]) < 30:
                          report["samples"]["raw_en_double_backtick"].append({"file": rel, "id": card.get("id"), "field": field, "sample": value[:240]})
                  shown = display_en(value)
                  post_hits = [p for p in forbidden_en if p in shown]
                  if post_hits:
                      report["post_runtime_beginner_en_forbidden_count"] += 1
                      if len(report["samples"]["post_en"]) < 30:
                          report["samples"]["post_en"].append({"file": rel, "id": card.get("id"), "field": field, "hits": post_hits, "sample": shown[:240]})
                  if "`" in shown:
                      report["post_runtime_beginner_en_backtick_count"] += 1

          for rel, card in iter_cards(ko_bundle):
              try: level = int(card.get("level", 999))
              except Exception: level = 999
              if level > 3: continue
              for field, value in visible_strings(card):
                  hits = sorted(set(author_token_re.findall(value)))
                  if hits:
                      report["raw_beginner_ko_author_token_count"] += 1
                      if len(report["samples"]["raw_ko_author_token"]) < 30:
                          report["samples"]["raw_ko_author_token"].append({"file": rel, "id": card.get("id"), "field": field, "hits": hits, "sample": value[:240]})

          audit_path = ROOT / "docs/audits/v4008_learner_text_reaudit.json"
          audit_path.parent.mkdir(parents=True, exist_ok=True)
          audit_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          if report["post_runtime_beginner_en_forbidden_count"] != 0 or report["post_runtime_beginner_en_backtick_count"] != 0:
              raise SystemExit("post-runtime learner-visible English residue remains; see audit report")

          # One-shot workflow removes itself in the successful patch commit.
          (ROOT / ".github/workflows/oneoff-v4008-beginner-text-quality.yml").unlink()
          PY

      - name: Local release-equivalent checks
        shell: bash
        run: |
          node --check src/pwa/app.js
          node --check src/pwa/v400_pedagogy_runtime.js
          node --check src/pwa/sw_v400_1.js
          python tools/validate_lessons.py
          python tools/validate_bilingual_lessons_v400_7.py
          python tools/validate_diagnostic_v400_7.py
          node tools/audit_v400_release_polish.js
          git diff --check

      - name: Commit repaired learner text
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Re-audit beginner learner text and repair residual artifacts"
          git push origin HEAD:main
