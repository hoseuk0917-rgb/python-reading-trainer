name: Applied practice quality V400 gate

on:
  push:
    branches:
      - main
    paths:
      - "src/pwa/applied_practice_quality_v400.js"
      - "src/pwa/admin_local_loader_v400_7.js"
      - "tools/audit_applied_practice_quality_v400.js"
      - ".github/workflows/applied-practice-quality-v400.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  applied-practice-quality-v400:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check src/pwa/applied_practice_quality_v400.js
          node --check src/pwa/admin_local_loader_v400_7.js
          node --check tools/audit_applied_practice_quality_v400.js

      - name: Applied practice regression audit
        run: node tools/audit_applied_practice_quality_v400.js

      - name: Patch integrity
        run: git diff --check
